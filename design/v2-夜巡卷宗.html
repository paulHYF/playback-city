<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>回放不夜城 · 设计稿 v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0f13; --night: #121a24; --night-2: #1b2531;
    --paper: #e8dcc0; --paper-2: #d9c8a2; --paper-line: rgba(90, 64, 34, 0.18);
    --ochre: #8a5a2c; --gold: #b8975a; --gold-dim: #8d7445; --lamp: #e3893a; --lamp-soft: rgba(227, 137, 58, 0.18);
    --seal: #a3312a; --text-ink: #2b2219; --text-mute: #6e6250; --jade: #7fa99a;
    --serif: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
    --brush: 'Ma Shan Zheng', 'STKaiti', serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #08090b; color: var(--paper); font-family: var(--serif); }
  .page { max-width: 1320px; margin: 0 auto; padding: 40px 20px 80px; }
  .page > header h1 { font-family: var(--brush); font-weight: 400; font-size: 44px; color: var(--gold); margin: 0; letter-spacing: 0.1em; }
  .page > header p { color: #8f8572; margin: 8px 0 0; font-size: 14px; }
  .tokens { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 8px; }
  .tok { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #a99d86; }
  .tok i { width: 22px; height: 22px; border-radius: 2px; display: inline-block; border: 1px solid rgba(255,255,255,0.08); }
  figure { margin: 48px 0 0; }
  figcaption { display: flex; gap: 14px; align-items: baseline; margin-bottom: 12px; }
  figcaption b { font-family: var(--brush); font-weight: 400; color: var(--gold); font-size: 26px; }
  figcaption span { color: #8f8572; font-size: 13px; }
  .frame { position: relative; width: 1280px; max-width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  .frame > svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frame .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.18; mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1px); background-size: 3px 3px; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,0.55)); }

  /* 卷宗：随身档案，代替 HUD */
  .dossier { position: absolute; background: linear-gradient(180deg, var(--paper), var(--paper-2)); color: var(--text-ink);
    border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,0.45), inset 0 0 40px rgba(120, 86, 40, 0.18); padding: 16px 18px 16px 30px; }
  .dossier::before { content: ''; position: absolute; left: 10px; top: 14px; bottom: 14px; width: 2px;
    background: repeating-linear-gradient(180deg, var(--ochre) 0 6px, transparent 6px 22px); opacity: 0.7; }
  .dossier h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.35em; color: var(--ochre); font-weight: 600; }
  .dossier.ruled { background: repeating-linear-gradient(180deg, transparent 0 27px, var(--paper-line) 27px 28px), linear-gradient(180deg, var(--paper), var(--paper-2)); }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; line-height: 28px; }
  .row b { font-size: 17px; font-weight: 600; }
  .seal { position: absolute; font-family: var(--brush); color: var(--seal); border: 2px solid var(--seal); border-radius: 3px;
    padding: 2px 5px; font-size: 18px; line-height: 1.05; transform: rotate(-8deg); opacity: 0.85; writing-mode: vertical-rl; }
  .lamps { display: flex; gap: 6px; }
  .lamps i { width: 12px; height: 16px; border-radius: 5px 5px 4px 4px; background: radial-gradient(circle at 50% 40%, #ffd08a, var(--lamp) 60%, #9a4a16); box-shadow: 0 0 8px rgba(227,137,58,0.7); }
  .lamps i.off { background: #4a4038; box-shadow: none; }
  .slots { display: flex; gap: 8px; margin-top: 4px; }
  .slot { width: 46px; height: 46px; border: 1px solid rgba(110, 82, 46, 0.45); border-radius: 2px; display: grid; place-items: center;
    font-size: 11px; color: var(--text-mute); background: rgba(255,255,255,0.18); text-align: center; line-height: 1.2; }
  .slot.has { color: var(--text-ink); border-color: var(--ochre); background: rgba(227,137,58,0.12); }

  /* 时辰牌 + 更鼓 */
  .watch { position: absolute; display: flex; align-items: center; gap: 12px; color: var(--paper); }
  .watch .plate { writing-mode: vertical-rl; font-family: var(--brush); font-size: 30px; letter-spacing: 0.15em; color: #f0dfb6;
    background: linear-gradient(90deg, #3a2516, #26170e); padding: 12px 8px; border: 1px solid var(--gold-dim); box-shadow: 0 6px 18px rgba(0,0,0,0.5); }
  .watch .meta { font-size: 13px; line-height: 1.7; color: #cdbf9f; }
  .watch .meta b { color: var(--lamp); font-weight: 600; }
  .dial { width: 64px; height: 64px; }

  .tag { position: absolute; font-size: 12px; color: #d8c9a6; background: rgba(13, 15, 19, 0.72); border: 1px solid rgba(184, 151, 90, 0.4);
    padding: 4px 10px; border-radius: 2px; letter-spacing: 0.05em; }
  .tag.trace { color: #e9b7a8; border-color: rgba(163, 49, 42, 0.6); }
  .btn { display: inline-block; font-family: var(--serif); font-size: 13px; padding: 6px 14px; border: 1px solid var(--ochre); color: var(--text-ink); background: rgba(227,137,58,0.12); border-radius: 2px; }
  .btn.dark { color: #f0dfb6; border-color: var(--gold-dim); background: rgba(13,15,19,0.6); }
  .vtitle { position: absolute; writing-mode: vertical-rl; font-family: var(--brush); color: rgba(240, 223, 182, 0.92); letter-spacing: 0.2em; }
  .notes { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 24px; color: #a99d86; font-size: 13px; line-height: 1.7; }
  .notes p { margin: 0; padding-left: 12px; border-left: 2px solid #3a2f22; }
  .notes b { color: #d8c9a6; font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>回放不夜城 · 设计稿 v2</h1>
    <p>夜巡破案 · 提灯、卷宗、更鼓。界面是随身卷宗与账簿，不用悬浮游戏 HUD；配色只用墨、赭、旧金、灯火橙与朱印。画面里的回放截帧、商品封面都来自测试环境的两场真实数据。</p>

          <text x="1095" y="478" fill="#6e6250" font-size="14" text-anchor="middle" font-family="Noto Serif SC">第四讲 · 函数与模块（未开）</text>

        <g>

      <div class="vtitle" style="left:612px; top:24px; font-size:22px; color:#e3d3a8; background:rgba(26,19,14,0.85); padding:10px 6px; border:1px solid #8d7445;">第三讲</div>

    <div class="notes">
      <p><b>楼阁 = 一讲回放</b>：层数随观看人次，挂朱旗表示已破解；未开的讲次楼阁不亮灯。数据来自回放列表与观看记录。</p>
      <p><b>绢幕在播真回放</b>：静音循环播本讲高光；点击进入「贰」的完整回放播放器。进度条上的红点是全场卡点。</p>
      <p><b>不用 HUD</b>：灯（生命）、积分、道具都写在右上的随身卷宗里；左上是时辰牌，更鼓按真实时辰敲。</p>

      </div>
      <div class="dossier ruled" style="right:36px; top:36px; width:320px; bottom:36px;">
        <h4>本 讲 卷 目</h4>
        <div class="row"><span>壹 · 为什么需要容器</span><span>00:28</span></div>
        <div class="row"><span>贰 · 列表索引与越界</span><span>01:54</span></div>
        <div class="row"><span>叁 · 切片</span><span>03:34</span></div>
        <div class="row"><span>肆 · 增删改与复制陷阱 <span style="color:var(--seal)">◆</span></span><span>04:17</span></div>
        <div class="row" style="background:rgba(227,137,58,0.15); margin:0 -8px; padding:0 8px;"><span><b style="font-size:14px">伍 · 字典、get 与键</b> <span style="color:var(--seal)">◆</span></span><span>06:37</span></div>
