<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回放不夜城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1217;
    --panel: #151b21;
    --panel-2: #1b232a;
    --line: #2a343c;
    --text: #ece3cf;
    --muted: #8f9a9c;
    --gold: #c9a45c;
    --gold-2: #e6cf98;
    --cinnabar: #c4503a;
    --jade: #8fcfb5;
    --qing: #9fc3c9;
    --brush: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
    --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
    --cap: "Cinzel", "Noto Serif SC", serif;
    --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.6; }
  .wrap { max-width: 1260px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 32px; display: grid; gap: 16px; }

  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  .brand h1 { margin: 0; font-family: var(--brush); font-weight: 400; font-size: 42px; line-height: 1.05; color: var(--gold-2); }
  .brand h1 small { font-family: var(--serif); font-size: 15px; color: var(--muted); letter-spacing: 0.2em; margin-left: 12px; }
  .course { margin-top: 6px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .course b { color: var(--text); font-weight: 500; }
[hidden] { display: none !important; }
  .hud { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .stat { display: grid; }
  .stat .k { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
  .stat .v { font-family: var(--cap); font-size: 20px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .hearts { font-size: 18px; letter-spacing: 2px; font-family: var(--body) !important; }
  .hearts .on { color: var(--cinnabar); }
  .hearts .off { color: #33393f; }
  .coin { color: var(--gold-2); }
  .jade { color: var(--jade); }
  .btn { font: inherit; font-size: 13px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 7px 12px; cursor: pointer; }
  .btn:hover:not(:disabled) { border-color: var(--gold); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn:focus-visible, .opt:focus-visible, .pad button:focus-visible, .screen:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
  .btn[aria-pressed="true"] { background: #33261a; border-color: var(--gold); color: var(--gold-2); }
  .btn.primary { background: var(--gold); color: #1d1408; border-color: var(--gold); font-weight: 700; }
  .btn.primary:disabled { background: #4a4235; border-color: #4a4235; color: #8b8270; }
  .btn.seal { background: var(--cinnabar); border-color: var(--cinnabar); color: #fbefe6; font-weight: 700; }

  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
  .game { display: grid; gap: 10px; min-width: 0; }
  .screen { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border: 1px solid #3a2f22; box-shadow: 0 0 0 3px #0a0d10, 0 0 0 4px #3a2f22; background: #07090c; overflow: hidden; }
  .screen canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .screen.shake { animation: shake 0.32s linear; }
  @keyframes shake { 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-4px, 1px); } 80% { transform: translate(3px, 0); } }
  .flash { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(196, 80, 58, 0) 30%, rgba(196, 80, 58, 0.65)); opacity: 0; pointer-events: none; transition: opacity 0.5s; }
  .flash.on { opacity: 1; transition: none; }
  .fade { position: absolute; inset: 0; background: #05070a; opacity: 0; pointer-events: none; transition: opacity 0.45s; display: grid; place-items: center; }
  .fade.on { opacity: 1; }
  .fade span { font-family: var(--brush); font-size: 40px; color: var(--gold-2); }
  .mm { position: absolute; right: 10px; top: 10px; width: 160px; height: auto; image-rendering: pixelated; border: 1px solid rgba(201, 164, 92, 0.45); background: rgba(8, 10, 12, 0.6); }
  .where { position: absolute; left: 12px; top: 10px; font-family: var(--brush); font-size: 24px; color: var(--gold-2); text-shadow: 0 1px 4px #000; pointer-events: none; }
  .ahead { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 5px 12px; font-size: 13px; color: var(--gold-2); background: rgba(10, 12, 14, 0.84); border: 1px solid rgba(201, 164, 92, 0.5); border-radius: 3px; text-align: center; pointer-events: none; }
  .toast { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); background: rgba(10, 12, 14, 0.92); border: 1px solid var(--gold); color: var(--gold-2); padding: 6px 14px; font-size: 13px; border-radius: 3px; pointer-events: none; max-width: calc(100% - 200px); text-align: center; }
  .fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0; max-width: 62ch; }
  .hint kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; padding: 0 5px; border-radius: 3px; color: var(--text); }
  .pad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 42px); gap: 4px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .pad button { font-size: 17px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; touch-action: none; }
  .pad button:active { background: #33261a; border-color: var(--gold); }

  .panel { display: grid; gap: 14px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 14px; display: grid; gap: 8px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.1em; color: var(--muted); }
  .room-title { font-family: var(--brush); font-weight: 400; font-size: 28px; line-height: 1.15; color: var(--gold-2); margin: 0; }
  .room-time { font-family: var(--mono); font-size: 12px; }
  .room-sum { margin: 0; color: #d6cdb9; font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 2px; background: var(--panel-2); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 2px; }
  .tag.boss { background: #3e1d16; color: #ffc0b0; }
  .tag.fog { background: #222b31; color: #c9d6d8; }
  .tag.npc { background: #1b2e33; color: #cfe0e0; }
  .tag.done { background: #1d3a2f; color: #a7e5c9; }
  .src { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); opacity: 0.4; transition: opacity 0.25s; }
  .src:first-child { border-top: 0; }
  .src.on { opacity: 1; }
  .src .dot { width: 8px; height: 8px; margin-top: 6px; background: var(--muted); }
  .src.on .dot { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .src b { font-weight: 500; font-size: 13px; }
  .src .role { color: #d6cdb9; font-size: 12.5px; }
  .src .api { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
  .log { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; max-height: 180px; overflow-y: auto; display: grid; gap: 3px; color: #c9c1ad; }
  .log .t { color: var(--muted); margin-right: 6px; }
  .log .ok { color: var(--jade); }
  .log .warn { color: var(--gold-2); }
  .log .bad { color: #ff9b8f; }
  .foot { color: var(--muted); font-size: 12px; max-width: 86ch; margin: 0; }

  .modal { position: fixed; inset: 0; background: rgba(4, 6, 8, 0.76); display: grid; place-items: center; z-index: 20; padding: 16px; }
  .dialog { width: min(600px, 100%); max-height: 88vh; overflow-y: auto; background: var(--panel); border: 1px solid #4a3d2a; border-radius: 4px; box-shadow: 0 0 0 2px #000, 0 24px 60px rgba(0, 0, 0, 0.6); padding: 18px; display: grid; gap: 12px; }
  .dialog h2 { margin: 0; font-family: var(--brush); font-weight: 400; font-size: 30px; line-height: 1.15; color: var(--gold-2); }
  .dialog h3 { margin: 4px 0 0; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; }
  .dialog p { margin: 0; }
  .q { font-size: 15px; font-weight: 500; }
  pre.code { margin: 0; font-family: var(--mono); font-size: 13px; line-height: 1.6; background: #0b0f13; border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; overflow-x: auto; color: #e9e1cc; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { font-family: var(--mono); font-size: 13px; text-align: left; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; cursor: pointer; min-height: 44px; }
  .opt:hover:not(:disabled) { border-color: var(--gold); }
  .opt.right { border-color: var(--jade); background: #173026; color: #c8f0dd; }
  .opt.wrong { border-color: var(--cinnabar); background: #36190f; color: #ffc3ba; text-decoration: line-through; }
  .opt:disabled { cursor: default; }
  .fb { font-size: 13.5px; padding: 10px 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel-2); }
  .fb.ok { border-color: #2f6b52; }
  .fb.bad { border-color: #7a322b; }
  .fb.hint { border-color: #5a4a2a; background: #211c13; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
  .actions .spacer { flex: 1; }
  .bossbar { display: flex; gap: 4px; }
  .bossbar i { flex: 1; height: 8px; background: var(--cinnabar); }
  .bossbar i.gone { background: #3a2422; }
  .video { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: linear-gradient(160deg, #1b2430, #0f141b); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .slide { position: absolute; inset: 8% 26% 22% 5%; background: #f3efe4; color: #22252e; border-radius: 2px; padding: 4% 5%; display: grid; align-content: start; gap: 6px; overflow: hidden; }
  .slide .st { font-weight: 700; font-size: clamp(11px, 2.4vw, 15px); }
  .slide pre { margin: 0; font-family: var(--mono); font-size: clamp(9px, 1.9vw, 12px); line-height: 1.5; white-space: pre-wrap; }
  .cam { position: absolute; right: 4%; top: 8%; width: 18%; aspect-ratio: 3 / 4; background: #2b3242; border-radius: 2px; display: grid; place-items: end center; overflow: hidden; }
  .cam::before { content: ""; position: absolute; top: 22%; left: 50%; width: 36%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: #c99f80; }
  .cam::after { content: ""; width: 78%; height: 34%; border-radius: 40% 40% 0 0; background: #3e5a7a; }
  .sub { position: absolute; left: 4%; right: 4%; bottom: 9%; text-align: center; font-size: clamp(11px, 2.5vw, 15px); color: #fff; text-shadow: 0 1px 2px #000, 0 0 6px #000; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255, 255, 255, 0.15); }
  .bar i { display: block; height: 100%; width: 0; background: var(--gold); }
  .vt { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .chat { display: grid; gap: 6px; }
  .msg { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; font-size: 13px; padding: 6px 10px; background: var(--panel-2); border-radius: 3px; }
  .msg .n { color: var(--qing); }
  .msg .tm { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .answer { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px; background: #16242a; border: 1px solid #2d4a52; border-radius: 3px; }
  .avatar { width: 64px; aspect-ratio: 3 / 4; border-radius: 3px; background: linear-gradient(#2d4a52, #16242a); position: relative; overflow: hidden; }
  .avatar::before { content: ""; position: absolute; top: 18%; left: 50%; width: 42%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: #e2bd9c; }
  .avatar::after { content: ""; position: absolute; bottom: 0; left: 12%; right: 12%; height: 36%; border-radius: 40% 40% 0 0; background: #dfe7e6; }
  .note { font-size: 12px; color: var(--muted); }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .grid4 > div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; }
  .grid4 .v { font-family: var(--cap); font-size: 22px; font-variant-numeric: tabular-nums; color: var(--gold-2); }
  .grid4 .k { font-size: 11px; color: var(--muted); }
  .review { display: grid; gap: 6px; }
  .review > div { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; padding: 8px 10px; background: var(--panel-2); border-radius: 3px; }
  .review b { font-weight: 500; }
  .review .when { font-family: var(--mono); font-size: 11.5px; color: var(--jade); }

  /* 店铺 */
  .wallet { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
  .wallet b { font-family: var(--cap); font-size: 16px; }
  .goods { display: grid; gap: 8px; }
  .good { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; }
  .good .ico { width: 52px; height: 52px; border-radius: 3px; display: grid; place-items: center; font-family: var(--brush); font-size: 26px; color: #fbefe6; }
  .good .nm { font-weight: 500; }
  .good .ds { font-size: 12.5px; color: #c9c1ad; }
  .good .pr { font-family: var(--cap); font-size: 13px; color: var(--gold-2); white-space: nowrap; }
  .good .pr s { color: var(--muted); margin-right: 6px; }
  .rule { font-size: 12.5px; color: var(--gold-2); background: #211c13; border: 1px dashed #5a4a2a; border-radius: 3px; padding: 8px 12px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs .btn[aria-selected="true"] { border-color: var(--gold); color: var(--gold-2); background: #33261a; }
  .scroll-body { font-family: var(--serif); font-size: 15px; line-height: 1.9; background: #f1e7d2; color: #2a2118; border-radius: 3px; padding: 16px 18px; border-left: 6px solid #8e2f22; border-right: 6px solid #8e2f22; }
  label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  textarea, select { font: inherit; color: var(--text); background: #0f1418; border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; }
  textarea { min-height: 110px; resize: vertical; }

  @media (max-width: 980px) { .stage { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) {
    .brand h1 { font-size: 34px; }
    .opts { grid-template-columns: 1fr; }
    .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .mm { width: 110px; }
    .toast { max-width: calc(100% - 32px); top: 90px; }
    .good { grid-template-columns: 44px minmax(0, 1fr); }
    .good .act { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen.shake { animation: none; }
    .src, .flash, .fade { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>回放不夜城<small id="subtitle">地上 · 回放广场</small></h1>
      <div class="course" id="courseLine"></div>
    </div>
    <div class="hud">
      <div class="stat" id="hpStat" hidden><span class="k">生命</span><span class="v hearts" id="hpView"></span></div>
      <div class="stat"><span class="k">铜钱</span><span class="v coin" id="coinView">0</span></div>
      <div class="stat"><span class="k">玉璧</span><span class="v jade" id="jadeView">0</span></div>
      <div class="stat"><span class="k">行囊</span><span class="v" id="bagView" style="font-size:14px;font-family:var(--body)">—</span></div>
      <button class="btn" id="oilBtn" type="button" hidden>点灯油</button>
      <button class="btn" id="teacherBtn" type="button" aria-pressed="false" hidden>讲师视角</button>
      <button class="btn" id="upBtn" type="button" hidden>回到地面</button>
      <button class="btn" id="resetBtn" type="button">重新开始</button>
    </div>
  </header>

  <main class="stage">
    <section class="game">
      <div class="screen" id="screen" tabindex="0" aria-label="第一人称 3D 场景。方向键前进后退和转身，面对建筑、店铺或宝函按前进交互">
        <canvas id="cv"></canvas>
        <div class="flash" id="flash"></div>
        <div class="where" id="where">回放广场</div>
        <canvas class="mm" id="mm" width="92" height="76" aria-hidden="true"></canvas>
        <div class="ahead" id="ahead" hidden></div>
        <div class="toast" id="toast" hidden></div>
        <div class="fade" id="fade"><span id="fadeText"></span></div>
      </div>
      <div class="controls">
        <p class="hint"><kbd>↑</kbd><kbd>↓</kbd>/<kbd>W</kbd><kbd>S</kbd> 前进后退，<kbd>←</kbd><kbd>→</kbd>/<kbd>A</kbd><kbd>D</kbd> 转身，<kbd>Q</kbd><kbd>E</kbd> 侧移。面对楼阁、店铺、宝函按前进即可交互。地上逛广场和店铺，进第 3 讲的楼阁下到地宫闯关，赚的铜钱回地面花。</p>
        <div class="pad" aria-label="移动按钮">
          <button type="button" data-act="left" aria-label="左转">⟲</button>
          <button type="button" data-act="fwd" aria-label="前进">▲</button>
          <button type="button" data-act="right" aria-label="右转">⟳</button>
          <button type="button" data-act="sl" aria-label="左移">◁</button>
          <button type="button" data-act="back" aria-label="后退">▼</button>
          <button type="button" data-act="sr" aria-label="右移">▷</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="card" id="roomCard"></div>
      <div class="card">
        <div class="eyebrow">这里由哪些数据生成</div>
        <div id="sources"></div>
      </div>
      <div class="card">
        <div class="eyebrow">数据流</div>
        <div class="log" id="log" aria-live="polite"></div>
      </div>
    </aside>
  </main>

  <p class="foot">原型 v3 · 示例数据：一套 Python 入门系列课（4 讲），其中第 3 讲带完整的大纲、字幕、聊天、观看记录、答题卡统计（按公开 OpenAPI 的数据形态编写）。3D 渲染用 Three.js，青砖、方砖、格扇窗、藻井、远山与宫灯全部由代码绘制，没有外部素材。商品下单、积分抵扣为演示逻辑。</p>

  <div class="modal" id="modal" hidden>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ═════════════ 示例数据（形态对齐公开 OpenAPI） ═════════════
  const DATA = {
    course: { channelId: '3958201', title: 'Python 入门 · 第 3 讲：列表、字典与循环', teacher: '林老师', date: '2026-10-12 20:00', duration: 4320, students: 186 },
    outline: [

  function hallStatus(s) {
    if (G.cleared.includes(s.no)) return 'cleared';

  // ═════════════ 地下：地宫（第 3 讲） ═════════════
  const PW = { name: 'palace' };
  const CW = 13, CH = 11;
  PW.cols = CW * 3 + 1; PW.rows = CH * 2 + 1;
  const LAYOUT = [[0, 0], [1, 0], [2, 0], [2, 1], [1, 1], [0, 1]];

  function genPalace() {
    const W = PW;
    const rnd = mulberry32(Number(DATA.course.channelId));
    const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    W.grid = Array.from({ length: W.rows }, () => new Array(W.cols).fill(0));
    W.roomOf = Array.from({ length: W.rows }, () => new Array(W.cols).fill(-1));
    W.rooms = LAYOUT.map(([cx, cy], i) => {
      const w = ri(8, 10), h = ri(6, 8);
      const x = cx * CW + 2 + ri(0, CW - 3 - w), y = cy * CH + 2 + ri(0, CH - 3 - h);
      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) { W.grid[yy][xx] = 1; W.roomOf[yy][xx] = i; }
      return { i, x, y, w, h, cx: x + Math.floor(w / 2), cy: y + Math.floor(h / 2) };
    });
    for (let i = 0; i < W.rooms.length - 1; i++) {
      const a = W.rooms[i], b = W.rooms[i + 1];
      let x = a.cx, y = a.cy;
      while (x !== b.cx) { x += Math.sign(b.cx - x); if (W.grid[y][x] === 0) W.grid[y][x] = 1; }
      while (y !== b.cy) { y += Math.sign(b.cy - y); if (W.grid[y][x] === 0) W.grid[y][x] = 1; }
    }
    for (let y = 0; y < W.rows; y++) for (let x = 0; x < W.cols; x++) {
      if (W.grid[y][x] !== 0) continue;
      let near = false;
      for (let dy = -1; dy <= 1 && !near; dy++) for (let dx = -1; dx <= 1; dx++) {
        const yy = y + dy, xx = x + dx;
        if (yy >= 0 && yy < W.rows && xx >= 0 && xx < W.cols && W.grid[yy][xx] === 1) { near = true; break; }
      }
      if (near) W.grid[y][x] = 2;
    }
    W.lampSpots = [];
    W.rooms.forEach(r => { [r.x + 1, r.x + r.w - 2].forEach(tx => { if (W.grid[r.y - 1][tx] === 2) W.lampSpots.push({ x: tx, y: r.y - 1, seed: rnd() * 10 }); }); });
    W.entities = [];
    const taken = [];
    const free = (x, y) => !taken.some(([a, b]) => Math.abs(a - x) <= 1 && Math.abs(b - y) <= 1);
    const place = r => {
      const cand = [];
      for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) {
        if (x === r.cx || y === r.cy) continue; // 十字通道保持畅通
        if (free(x, y)) cand.push([x, y]);
      }
      const p = cand[Math.floor(rnd() * cand.length)];
      taken.push(p);
      return p;
    };
    W.rooms.forEach(r => {
      DATA.clusters.filter(c => c.seg === r.i).forEach((c, k) => { const [x, y] = place(r); W.entities.push({ id: 'npc' + r.i + '_' + k, type: 'npc', room: r.i, x, y, cluster: c }); });
      if (r.i === BOSS_ROOM) {
        const [x, y] = place(r);
        W.entities.push({ id: 'boss', type: 'boss', room: r.i, x, y, kw: 'KeyError 镇墓兽', qids: DATA.questions.filter(q => q.seg === r.i).map(q => q.id) });
      } else {
        DATA.questions.filter(q => q.seg === r.i).forEach(q => { const [x, y] = place(r); W.entities.push({ id: q.id, type: 'chest', room: r.i, x, y, kw: q.kw, qids: [q.id], color: JADE_COLORS[r.i % JADE_COLORS.length] }); });
      }
    });
    const last = W.rooms[LAST_ROOM];
    W.entities.push({ id: 'portal', type: 'portal', room: LAST_ROOM, x: last.cx, y: last.cy });
  }

  function buildPalace() {
    const W = PW;
    genPalace();
    W.group = new THREE.Group(); scene.add(W.group);
    const grp = W.group;
    W.lights = [];
    const walls = [], floors = [], corrs = [];
    for (let y = 0; y < W.rows; y++) for (let x = 0; x < W.cols; x++) {
      if (W.grid[y][x] === 2) walls.push([x, y]);
      else if (W.grid[y][x] === 1) (W.roomOf[y][x] >= 0 ? floors : corrs).push([x, y]);
    }
    const m = new THREE.Matrix4();
    const inst = (geo, mat, list, yy) => {
      const mesh = new THREE.InstancedMesh(geo, mat, list.length);
      list.forEach(([x, y], i) => { m.makeTranslation(x + 0.5, yy, y + 0.5); mesh.setMatrixAt(i, m); });
      mesh.instanceMatrix.needsUpdate = true; mesh.frustumCulled = false; grp.add(mesh);
    };
    inst(new THREE.BoxGeometry(1, WALL_H, 1), M.wall, walls, WALL_H / 2);
    const fg = new THREE.PlaneGeometry(1, 1); fg.rotateX(-Math.PI / 2);
    inst(fg, M.floor, floors, 0);
    inst(fg, M.corridor, corrs, 0);
    const cg = new THREE.PlaneGeometry(1, 1); cg.rotateX(Math.PI / 2);
    inst(cg, M.ceil, floors.concat(corrs), WALL_H);
    // 格扇窗与朱漆立柱
    const panels = [], cols = [];
    const Qy = (ry) => new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), ry);
    W.rooms.forEach(r => {
      for (let k = 0; k < r.w; k += 2) {
        if (W.grid[r.y - 1][r.x + k] === 2) panels.push([r.x + k + 0.5, r.y + 0.012, 0]);
        if (W.grid[r.y + r.h][r.x + k] === 2) panels.push([r.x + k + 0.5, r.y + r.h - 0.012, Math.PI]);
      }
      for (let k = 0; k < r.h; k += 2) {
        if (W.grid[r.y + k][r.x - 1] === 2) panels.push([r.x + 0.012, r.y + k + 0.5, Math.PI / 2]);
        if (W.grid[r.y + k][r.x + r.w] === 2) panels.push([r.x + r.w - 0.012, r.y + k + 0.5, -Math.PI / 2]);
      }
      for (let k = 0; k <= r.w; k += 2) { cols.push([r.x + k, r.y + 0.07]); cols.push([r.x + k, r.y + r.h - 0.07]); }
      for (let k = 2; k < r.h; k += 2) { cols.push([r.x + 0.07, r.y + k]); cols.push([r.x + r.w - 0.07, r.y + k]); }
    });
    const pm = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.62, 0.6), new THREE.MeshBasicMaterial({ map: latticeTex, color: 0xd9b98a }), panels.length);
    const one = new THREE.Vector3(1, 1, 1);
    panels.forEach(([x, z, ry], i) => { m.compose(new THREE.Vector3(x, 0.66, z), Qy(ry), one); pm.setMatrixAt(i, m); });
    pm.instanceMatrix.needsUpdate = true; pm.frustumCulled = false; grp.add(pm);
    const colPart = (geo, mat, y) => {
      const im = new THREE.InstancedMesh(geo, mat, cols.length);
      cols.forEach(([x, z], i) => { m.makeTranslation(x, y, z); im.setMatrixAt(i, m); });
      im.instanceMatrix.needsUpdate = true; im.frustumCulled = false; grp.add(im);
    };
    colPart(new THREE.CylinderGeometry(0.05, 0.056, WALL_H - 0.1, 10), M.cinna, WALL_H / 2);
    colPart(new THREE.CylinderGeometry(0.08, 0.095, 0.08, 10), M.stone, 0.04);
    colPart(new THREE.BoxGeometry(0.15, 0.06, 0.15), M.gold, WALL_H - 0.08);
    // 宫灯
    W.lampSpots.forEach(sp => {
      const x = sp.x + 0.5, z = sp.y + 1.24;
      addPalaceLantern(grp, x, 0.95, z, W.lights, sp.seed);
      grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, 1.08, z), new THREE.Vector3(x, WALL_H, z)]), new THREE.LineBasicMaterial({ color: 0x5a4030 })));
    });
    // 入口：楼梯光（第一个殿室中心上方）
    buildPalaceEntities();
    buildPalaceOverlays();
    W.seen = new Uint8Array(W.cols * W.rows);
  }

  // ═════════════ 移动与交互 ═════════════
  function doAction(a) {
    const p = pl();
    if (a === 'left' || a === 'right') {
      p.dir = (p.dir + (a === 'left' ? 3 : 1)) % 4;
      tn.f = P.yaw; tn.to = P.yaw + (a === 'left' ? 1 : -1) * Math.PI / 2; tn.t = 0;
      return;
    }
    const off = { fwd: 0, back: 2, sl: 3, sr: 1 }[a];
    const [dx, dy] = DIRS[(p.dir + off) % 4];
    tryStep(dx, dy, a === 'fwd');
  }
  function onTile(e, x, y) { return e.tiles ? e.tiles.some(([a, b]) => a === x && b === y) : (e.x === x && e.y === y); }
  function blocker(x, y) {
    return CUR.entities.find(e => onTile(e, x, y) && !(e.type === 'boss' && S && S.dead.includes('boss')));
  }
  function tryStep(dx, dy, facing) {
    const p = pl();
    const nx = p.px + dx, ny = p.py + dy;
    if (ny < 0 || ny >= CUR.rows || nx < 0 || nx >= CUR.cols || CUR.grid[ny][nx] !== 1) { bump.t = 0; bump.dx = dx; bump.dz = dy; return; }
    if (mode === 'palace') {
      const r = PW.roomOf[ny][nx];
      if (r >= 0 && FOG_ROOMS.includes(r) && !S.explored.includes(r)) { held.length = 0; openExplore(r); return; }
    }
    const e = blocker(nx, ny);
    if (e) {
      held.length = 0;
      if (e.type === 'deco') { bump.t = 0; bump.dx = dx; bump.dz = dy; return; }
      if (!facing) { toast('转过身面对它，再按前进'); return; }
      interact(e); return;
    }
    p.px = nx; p.py = ny;
    mv.fx = P.x; mv.fz = P.z; mv.tx = nx + 0.5; mv.tz = ny + 0.5; mv.t = 0;
    if (mode === 'palace') {
      markSeen(nx, ny, 2);
      const r = PW.roomOf[ny][nx];
      if (r >= 0) enterRoom(r);
    } else renderSurfacePanel();
  }
  function enterRoom(r) {
    if (!S.visited.includes(r)) {

      addLog('进入第 ' + (r + 1) + ' 殿「' + seg.title + '」' + fmt(seg.start) + '–' + fmt(seg.end));
    }
    const rm = PW.rooms[r];
    for (let y = rm.y - 1; y <= rm.y + rm.h; y++) for (let x = rm.x - 1; x <= rm.x + rm.w; x++) PW.seen[y * PW.cols + x] = 1;
    if (r !== curRoom) { curRoom = r; renderPanel(r); }
  }
  function markSeen(px, py, rad) {
    for (let y = py - rad; y <= py + rad; y++) for (let x = px - rad; x <= px + rad; x++) if (y >= 0 && y < PW.rows && x >= 0 && x < PW.cols) PW.seen[y * PW.cols + x] = 1;
  }

  function openReplay(q) {
    S.falls++;
    const seg = DATA.outline[q.seg];
    const t0 = q.t - 20, t1 = q.t + 20, DUR = 6500;
    openModal(
      '<div class="eyebrow">生命耗尽 · 复活条件</div><h2>回到回放里，补上这 40 秒</h2>' +
      '<p class="note">第 ' + (q.seg + 1) + ' 段「' + esc(seg.title) + '」。演示按 6 倍速播放；正式版用播放器 SDK 跳到 ' + fmt(t0) + ' 正常播放 40 秒。</p>' +
      '<div class="video"><div class="slide"><div class="st">' + esc(seg.title) + '</div><pre>' + esc(q.code || seg.summary) + '</pre></div>' +
      '<div class="cam"></div><div class="sub" id="sub"></div><div class="bar"><i id="barI"></i></div></div>' +
      '<div class="vt"><span id="vcur">' + fmt(t0) + '</span><span>' + fmt(t1) + '</span></div>' +
      '<div class="actions"><button class="btn primary" type="button" id="revive" disabled>播放中…</button></div>');
    const start = performance.now();
    const tick = () => {
      if (modal.hidden || !$('#barI')) return;
      const p = Math.min(1, (performance.now() - start) / DUR);
      const cur = t0 + (t1 - t0) * p;
      $('#barI').style.width = (p * 100) + '%';
      $('#vcur').textContent = fmt(cur);
      const line = q.subs.filter(([o]) => q.t + o <= cur).pop();
      $('#sub').textContent = line ? line[1] : '';
      if (p < 1) requestAnimationFrame(tick);
      else {
        const b = $('#revive'); b.disabled = false; b.textContent = '复活（♥ × 3）';
        b.onclick = () => { S.hp = 3; updateHud(); addLog('看完回放 ' + fmt(t0) + '–' + fmt(t1) + ' → 复活', 'warn'); closeModal(); };
        b.focus({ preventScroll: true });
      }
    };
    requestAnimationFrame(tick);
    addLog('倒下 → 回放 ' + fmt(t0) + '–' + fmt(t1) + '（智能字幕片段）', 'warn');
  }

  function applyPalaceState() {
    if (!PW.group || !S) return;
    PW.entities.forEach(e => {
      e.obj.visible = !(FOG_ROOMS.includes(e.room) && !S.explored.includes(e.room));
      const done = S.dead.includes(e.id);
      const animating = anims.some(a => a.e === e);
      if (e.type === 'chest') {
        if (!animating) { e.lid.rotation.x = done ? -1.9 : 0; e.gem.visible = e.glow.visible = !done; e.gem.position.y = 0.66; e.gem.scale.setScalar(1); e.glow.material.opacity = 1; }
        e.label.visible = !done;
      } else if (e.type === 'boss') {
        if (!animating) { e.core.visible = e.glow.visible = e.hoard.visible = !done; e.core.scale.setScalar(1); }
        e.label.visible = !done;
        bossLight.intensity = done || mode !== 'palace' ? 0 : 1.3;
        setLabel(e.label, '镇墓兽 · KeyError ' + '♥'.repeat(Math.max(0, S.bossHp)));
      } else if (e.type === 'npc') {
        const seenIt = S.seenNpc.includes(e.id);
        setLabel(e.label, (seenIt ? '' : '! ') + e.cluster.count + ' 人问过', seenIt ? '#cfe0e0' : '#ffe7a0');
      } else if (e.type === 'portal') {
        const on = S.dead.includes('boss');
        e.ring.material.color.setHex(on ? 0xc9a45c : 0x5a5f5c);
        e.disc.material.color.setHex(on ? 0xf1e6c8 : 0x3a3f44);
        portalLight.intensity = on && mode === 'palace' ? 1.6 : 0;
        setLabel(e.label, on ? '月洞门：出地宫' : '月洞门（未开启）');
      }
    });
    Object.keys(mists).forEach(ri => { mists[ri].grp.visible = !S.explored.includes(Number(ri)); });
  }

  // ═════════════ 小地图 ═════════════
  const mm = $('#mm'), mctx = mm.getContext('2d');
  function drawMinimap() {
    const T = 4, W = CUR;
    mctx.clearRect(0, 0, mm.width, mm.height);
    const allSeen = mode === 'surface' || (S && S.oilLit);
    for (let y = 0; y < W.rows; y++) for (let x = 0; x < W.cols; x++) {
      if (!allSeen && !W.seen[y * W.cols + x]) continue;
      const g = W.grid[y][x];
      if (!g) continue;
      if (g === 2) mctx.fillStyle = '#3a3f46';
      else if (mode === 'palace') {
        const r = PW.roomOf[y][x];
        mctx.fillStyle = r >= 0 && FOG_ROOMS.includes(r) && !S.explored.includes(r) ? '#4a5a62' : r >= 0 ? '#5e5b52' : '#45433d';
      } else mctx.fillStyle = '#4a4c4d';
      mctx.fillRect(x * T, y * T, T, T);
    }
    if (mode === 'palace' && S.teacher) PW.rooms.forEach(r => { mctx.fillStyle = 'rgba(184,67,47,' + (DATA.failRate[r.i] / 100 * 0.85) + ')'; mctx.fillRect(r.x * T, r.y * T, r.w * T, r.h * T); });
    W.entities.forEach(e => {
      const tiles = e.tiles || [[e.x, e.y]];
      let c = null;
      if (mode === 'palace') {
        if (!allSeen && !W.seen[e.y * W.cols + e.x]) return;
        if (!e.obj.visible || (e.type === 'boss' && S.dead.includes('boss'))) return;
        c = e.type === 'chest' ? (S.dead.includes(e.id) ? '#6b6457' : '#e6cf98') : e.type === 'boss' ? '#d9553a' : e.type === 'npc' ? '#cfe0e0' : (S.dead.includes('boss') ? '#e6cf98' : '#5a5f5c');
      } else {
        c = e.type === 'hall' ? (hallStatus(e.series) === 'open' ? '#e6cf98' : hallStatus(e.series) === 'cleared' ? '#b8432f' : '#6b5a3a') : e.type === 'shop' ? '#8fcfb5' : e.type === 'tavern' ? '#c4503a' : e.type === 'board' ? '#efe2c4' : '#ffc070';
      }
      mctx.fillStyle = c; tiles.forEach(([x, y]) => mctx.fillRect(x * T, y * T, T, T));
    });
    const cx = P.x * T, cy = P.z * T, a = -P.yaw, fx = Math.sin(a), fz = -Math.cos(a);
    mctx.fillStyle = '#fff3d0';
    mctx.beginPath(); mctx.moveTo(cx + fx * 6, cy + fz * 6); mctx.lineTo(cx - fx * 3 + fz * 4, cy - fz * 3 - fx * 4); mctx.lineTo(cx - fx * 3 - fz * 4, cy - fz * 3 + fx * 4); mctx.closePath(); mctx.fill();
  }

  // ═════════════ 前方提示 ═════════════
  let lastAhead = '';
  function updateAhead() {
    let text = '';
    if (mv.t >= 1 && tn.t >= 1 && modal.hidden && !fading) {
      const p = pl(); const [dx, dy] = DIRS[p.dir];
      const nx = p.px + dx, ny = p.py + dy;
      if (ny >= 0 && ny < CUR.rows && nx >= 0 && nx < CUR.cols) {
        const e = blocker(nx, ny);
        if (mode === 'palace') {
          const r = PW.roomOf[ny][nx];
          if (r >= 0 && FOG_ROOMS.includes(r) && !S.explored.includes(r)) text = '前方：墨雾封印 · 按前进查看';
          else if (e && e.type === 'chest') text = S.dead.includes(e.id) ? '前方：空宝函' : '前方：上锁的宝函「' + e.kw + '」· 按前进开锁';
          else if (e && e.type === 'boss') text = '前方：镇墓兽 · 按前进挑战';
          else if (e && e.type === 'npc') text = '前方：书生灯影 · 按前进请教';
          else if (e && e.type === 'portal') text = S.dead.includes('boss') ? '前方：月洞门 · 按前进出地宫' : '前方：未开启的月洞门';
        } else if (e) {
          if (e.type === 'hall') { const st = hallStatus(e.series); text = '前方：第 ' + e.series.no + ' 讲楼阁 · ' + ({ open: '按前进推门', cleared: '已通关', locked: '未开启', soon: '已开启' })[st]; }
          else if (e.type === 'shop') text = '前方：' + e.name + ' · 按前进进店';
          else if (e.type === 'board') text = '前方：回放榜 · 按前进查看';
          else if (e.type === 'tavern') text = '前方：酒馆 · 按前进看看';
        }
      }
    }
    if (text !== lastAhead) { lastAhead = text; const el = $('#ahead'); el.textContent = text; el.hidden = !text; }
  }

  // ═════════════ 主循环 ═════════════
  const held = [];
  let last = performance.now();
  const camPos = new THREE.Vector3();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = now / 1000;
    if (mv.t < 1) { mv.t = Math.min(1, mv.t + dt / 0.22); const k = ease(mv.t); P.x = mv.fx + (mv.tx - mv.fx) * k; P.z = mv.fz + (mv.tz - mv.fz) * k; }
    if (tn.t < 1) { tn.t = Math.min(1, tn.t + dt / 0.2); P.yaw = tn.f + (tn.to - tn.f) * ease(tn.t); }
    if (bump.t < 1) bump.t = Math.min(1, bump.t + dt / 0.18);
    if (mv.t >= 1 && tn.t >= 1 && bump.t >= 1 && held.length && modal.hidden && !fading) doAction(held[held.length - 1]);

    const b = Math.sin(bump.t * Math.PI) * 0.1;
    const bob = reduceMotion ? 0 : Math.sin(mv.t * Math.PI) * 0.025;
    camera.position.set(P.x + bump.dx * b, EYE + bob, P.z + bump.dz * b);
    camera.rotation.set(mode === 'surface' ? 0.02 : -0.05, P.yaw, 0);
    camPos.copy(camera.position);

    const flick = reduceMotion ? 0 : Math.sin(t * 11) * 0.06 + Math.sin(t * 23) * 0.04;
    hand.position.set(P.x, EYE + 0.15, P.z);
    hand.intensity = (mode === 'palace' ? 1.35 : 0.6) + flick;
    CUR.lights.slice().sort((a, c) => ((a.wx - P.x) ** 2 + (a.wz - P.z) ** 2) - ((c.wx - P.x) ** 2 + (c.wz - P.z) ** 2))
      .slice(0, pool.length).forEach((lt, i) => { pool[i].position.set(lt.wx, (lt.wy || 0.9) - 0.05, lt.wz + 0.1); pool[i].intensity = 1.15 + (reduceMotion ? 0 : Math.sin(t * 9 + lt.seed) * 0.12); });
    CUR.lights.forEach(lt => { if (lt.flame) { const s = reduceMotion ? 1 : 1 + Math.sin(t * 7 + lt.seed) * 0.07; lt.flame.scale.set(0.5 * s, 0.5 * s, 1); } });

    if (mode === 'palace') {
      PW.entities.forEach(e => {
        if (!e.obj.visible) return;
        const face = () => { e.obj.rotation.y = Math.atan2(camPos.x - e.obj.position.x, camPos.z - e.obj.position.z); };
        if (e.type === 'chest' && !S.dead.includes(e.id)) {
          e.gem.rotation.y = t * 1.6; e.gem.position.y = 0.66 + (reduceMotion ? 0 : Math.sin(t * 2.2 + e.x) * 0.03);
          e.glow.position.y = e.gem.position.y; e.label.visible = S.visited.includes(e.room);
        } else if (e.type === 'boss' && e.core.visible) {
          face(); e.core.position.y = 0.74 + (reduceMotion ? 0 : Math.sin(t * 1.8) * 0.05);
          e.glow.material.opacity = 0.55 + Math.abs(Math.sin(t * 2)) * 0.3;
        } else if (e.type === 'npc') {
          face(); e.body.position.y = reduceMotion ? 0 : Math.sin(t * 2 + e.x) * 0.05; e.label.visible = S.visited.includes(e.room);
        } else if (e.type === 'portal') {
          face(); e.disc.rotation.z = -t * (S.dead.includes('boss') ? 2.4 : 0.4); e.label.visible = S.visited.includes(e.room);
        }
      });
      for (let i = anims.length - 1; i >= 0; i--) {
        const a = anims[i]; a.t += dt;
        if (a.kind === 'open') {
          a.e.lid.rotation.x = -1.9 * ease(Math.min(1, a.t / 0.5));
          const g = Math.min(1, Math.max(0, (a.t - 0.25) / 0.6));
          a.e.gem.position.y = 0.66 + g * 0.9; a.e.gem.scale.setScalar(1 + g * 0.6); a.e.gem.rotation.y += dt * 12;
          a.e.glow.position.y = a.e.gem.position.y; a.e.glow.material.opacity = 1 - g;
          if (a.t > 0.9) { a.e.gem.visible = false; a.e.glow.visible = false; a.e.glow.material.opacity = 1; anims.splice(i, 1); }
        } else {
          const k = Math.min(1, a.t / 0.9);
          a.e.core.scale.setScalar(1 - ease(k)); a.e.core.rotation.y += dt * 14;
          a.e.glow.scale.setScalar(1.4 + k * 1.5); a.e.glow.material.opacity = 1 - k;
          bossLight.intensity = 1.3 + Math.sin(k * Math.PI) * 3;
          if (k >= 1) { a.e.core.visible = a.e.glow.visible = a.e.hoard.visible = false; a.e.glow.scale.setScalar(1.4); a.e.glow.material.opacity = 1; bossLight.intensity = 0; anims.splice(i, 1); }
        }
      }
      Object.values(mists).forEach(m => { if (m.grp.visible) { m.box.material.map.offset.x = (t * 0.05) % 1; m.box.material.map.offset.y = (t * 0.02) % 1; m.box.material.opacity = 0.75 + Math.sin(t * 1.5) * 0.1; } });
    } else {
      SW.entities.forEach(e => { if (e.type === 'hall' && e.doorGlow.visible) e.doorGlow.material.opacity = 0.6 + Math.sin(t * 2.4) * 0.3; if (e.flag && e.flag.visible && !reduceMotion) e.flag.rotation.y = Math.sin(t * 2 + e.x) * 0.25; });
    }

    renderer.render(scene, camera);
    drawMinimap();
    updateAhead();
    requestAnimationFrame(frame);
  }
  function resize() {
    const r = screenEl.getBoundingClientRect();
    const w = Math.max(1, r.width), h = Math.max(1, r.height);
    const iw = Math.round(Math.min(w * (window.devicePixelRatio || 1), 800));
    renderer.setSize(iw, Math.round(iw * h / w), false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }

  // ═════════════ 输入 ═════════════
  const KEYS = { ArrowUp: 'fwd', w: 'fwd', W: 'fwd', ArrowDown: 'back', s: 'back', S: 'back', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', q: 'sl', Q: 'sl', e: 'sr', E: 'sr' };
  window.addEventListener('keydown', ev => {
    const act = KEYS[ev.key];
    if (!act || !modal.hidden) return;
    if (ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
    ev.preventDefault();
    if (!held.includes(act)) held.push(act);
  });
  window.addEventListener('keyup', ev => { const act = KEYS[ev.key]; if (!act) return; const i = held.indexOf(act); if (i >= 0) held.splice(i, 1); });
  window.addEventListener('blur', () => { held.length = 0; });
  document.querySelectorAll('.pad button').forEach(b => {
    const act = b.dataset.act;
    const release = () => { const i = held.indexOf(act); if (i >= 0) held.splice(i, 1); };
    b.addEventListener('pointerdown', ev => { ev.preventDefault(); if (modal.hidden && !held.includes(act)) held.push(act); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => b.addEventListener(n, release));
  });
  $('#teacherBtn').onclick = () => { if (!S) return; S.teacher = !S.teacher; updateHud(); addLog(S.teacher ? '切到讲师视角：地面叠加全班卡关率' : '回到学员视角', 'warn'); };
  $('#upBtn').onclick = () => exitPalace(false);
  $('#oilBtn').onclick = () => { if (!S || !G.items.oil || S.oilLit) return; G.items.oil--; S.oilLit = true; updateHud(); addLog('点上灯油：地宫全图点亮', 'warn'); toast('灯油点亮了整座地宫的地图'); };
  $('#resetBtn').onclick = () => {
    G = freshG(); S = null; anims.length = 0; U.px = 11; U.py = 12; U.dir = 0;
    if (mode === 'palace') transition('回 地 面', () => { setMode('surface'); applySurfaceState(); renderSurfacePanel(true); });
    else { applySurfaceState(); syncPlayer(); updateHud(); renderSurfacePanel(true); }
    addLog('重新开始', 'warn');
  };

  // ═════════════ 启动 ═════════════
  G = freshG();
  buildSurface();
  setMode('surface');
  applySurfaceState();
  renderSurfacePanel(true);
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(screenEl); else window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
    labels.forEach(s => setLabel(s, s.userData.text));
    vBanners.forEach(v => { v.mesh.material.map.dispose(); v.mesh.material.map = vTex(v.text, v.bg, v.fg); v.mesh.material.needsUpdate = true; });
  });
  [
    ['GET 回放列表 → 系列课 4 讲，生成 4 座楼阁', ''],
    ['GET 观看记录 → 第 1、2 讲已通关，挂朱旗', 'ok'],
    ['GET 商品库 → 3 件商品上架课程铺', ''],
    ['积分体系 → 铜钱，初始 30', ''],
    ['回放广场生成完毕。第 3 讲楼阁的门开着', 'warn']
  ].forEach(([tx, k], i) => setTimeout(() => addLog(tx, k), 120 + i * 260));
  setTimeout(() => toast('↑ 往前走是楼阁街，转身是商店街'), 500);
  screenEl.focus({ preventScroll: true });
  requestAnimationFrame(tt => { last = tt; frame(tt); });
})();
</script>
</body>
</html>
