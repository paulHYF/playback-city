<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回放不夜城 · 夜巡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0f13; --paper: #e8dcc0; --paper-2: #d9c8a2; --paper-line: rgba(90, 64, 34, 0.16);
    --ochre: #8a5a2c; --gold: #b8975a; --gold-dim: #8d7445; --lamp: #e3893a; --seal: #a3312a;
    --text-ink: #2b2219; --text-mute: #6e6250;
    --serif: 'Noto Serif SC', 'Songti SC', 'STSong', serif; --brush: 'Ma Shan Zheng', 'STKaiti', serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #08090b; color: var(--paper); font-family: var(--serif); overflow: hidden; }
  [hidden] { display: none !important; }
  #screen { position: fixed; inset: 0; outline: none; }
  #cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,0.5)); }

  .paper { background: repeating-linear-gradient(180deg, transparent 0 27px, var(--paper-line) 27px 28px), linear-gradient(180deg, var(--paper), var(--paper-2));
    color: var(--text-ink); border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 40px rgba(120, 86, 40, 0.18); position: relative; }
  .paper.bound { padding-left: 30px; }
  .paper.bound::before { content: ''; position: absolute; left: 10px; top: 14px; bottom: 14px; width: 2px; background: repeating-linear-gradient(180deg, var(--ochre) 0 6px, transparent 6px 22px); opacity: 0.7; }
  .paper h4 { margin: 0 0 6px; font-size: 13px; letter-spacing: 0.35em; color: var(--ochre); font-weight: 600; }
  .seal { position: absolute; font-family: var(--brush); color: var(--seal); border: 2px solid var(--seal); border-radius: 3px; padding: 2px 5px; font-size: 16px; line-height: 1.05; transform: rotate(-8deg); opacity: 0.85; writing-mode: vertical-rl; pointer-events: none; }

  /* 时辰牌 */
  .watch { position: fixed; left: 20px; top: 18px; display: flex; gap: 12px; align-items: center; pointer-events: none; }
  .watch .plate { writing-mode: vertical-rl; font-family: var(--brush); font-size: 30px; letter-spacing: 0.15em; color: #f0dfb6; background: linear-gradient(90deg, #3a2516, #26170e); padding: 12px 8px; border: 1px solid var(--gold-dim); box-shadow: 0 6px 18px rgba(0,0,0,0.5); }
  .watch .meta { font-size: 13px; line-height: 1.75; color: #d8c9a6; text-shadow: 0 1px 4px #000; }
  .watch .meta b { color: var(--lamp); font-weight: 600; }
  .watch.day .plate { background: linear-gradient(90deg, #e8dcc0, #d9c8a2); color: #2b2219; border-color: var(--ochre); }
  .watch.day .meta { color: #2b2219; text-shadow: 0 1px 2px rgba(255,255,255,0.4); }

  /* 随身卷宗 */
  #dossier { position: fixed; right: 18px; top: 16px; width: 248px; padding: 14px 16px 12px 30px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; line-height: 28px; }
  .row b { font-size: 17px; }
  .lamps { display: flex; gap: 5px; }
  .lamps i { width: 11px; height: 15px; border-radius: 5px 5px 4px 4px; background: radial-gradient(circle at 50% 40%, #ffd08a, var(--lamp) 60%, #9a4a16); box-shadow: 0 0 8px rgba(227,137,58,0.7); }
  .lamps i.off { background: #4a4038; box-shadow: none; }
  .slots { display: flex; gap: 6px; margin: 4px 0 6px; }
  .slot { width: 44px; height: 44px; border: 1px solid rgba(110, 82, 46, 0.45); border-radius: 2px; display: grid; place-items: center; font-size: 11px; color: var(--text-mute); background: rgba(255,255,255,0.18); text-align: center; line-height: 1.2; }
  .slot.has { color: var(--text-ink); border-color: var(--ochre); background: rgba(227,137,58,0.14); font-weight: 600; }
  .tiny { font-size: 12px; color: var(--text-mute); line-height: 1.6; }
  .btn { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--ochre); color: var(--text-ink); background: rgba(227,137,58,0.12); border-radius: 2px; cursor: pointer; }
  .btn:hover { background: rgba(227,137,58,0.28); }
  .btn.red { background: var(--seal); border-color: var(--seal); color: #f6ecd6; }
  .btn.dark { color: #f0dfb6; border-color: var(--gold-dim); background: rgba(13,15,19,0.6); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  #mm { position: fixed; right: 18px; bottom: 18px; width: 150px; image-rendering: pixelated; border: 1px solid rgba(184, 151, 90, 0.5); background: rgba(8, 10, 12, 0.65); }
  #where { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); font-family: var(--brush); font-size: 26px; color: #e3d3a8; text-shadow: 0 2px 8px #000; pointer-events: none; letter-spacing: 0.2em; }
  #ahead { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); font-size: 14px; color: #f0dfb6; background: rgba(13, 15, 19, 0.78); border: 1px solid rgba(184, 151, 90, 0.5); padding: 6px 14px; border-radius: 2px; pointer-events: none; }
  #toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); font-size: 14px; color: #f0dfb6; background: rgba(13, 15, 19, 0.88); border: 1px solid var(--gold); padding: 6px 16px; border-radius: 2px; pointer-events: none; }
  .hint { position: fixed; left: 20px; bottom: 16px; font-size: 12px; color: rgba(232, 220, 192, 0.7); text-shadow: 0 1px 3px #000; pointer-events: none; }
  kbd { font-family: ui-monospace, monospace; font-size: 11px; border: 1px solid rgba(232,220,192,0.4); border-radius: 3px; padding: 0 4px; }
  #fade { position: fixed; inset: 0; background: #05070a; opacity: 0; pointer-events: none; transition: opacity 0.45s; display: grid; place-items: center; z-index: 30; }
  #fade.on { opacity: 1; }
  #fade span { font-family: var(--brush); font-size: 54px; color: var(--gold); letter-spacing: 0.4em; }
  #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(163, 49, 42, 0.6)); opacity: 0; transition: opacity 0.5s; z-index: 5; }
  #flash.on { opacity: 1; transition: none; }

  /* 卷宗弹窗 */
  #modal { position: fixed; inset: 0; background: rgba(4, 5, 7, 0.62); display: grid; place-items: center; z-index: 20; padding: 16px; }
  #dialog { width: min(640px, 100%); max-height: 88vh; overflow-y: auto; padding: 22px 26px 22px 40px; }
  #dialog h2 { margin: 2px 0 10px; font-family: var(--brush); font-weight: 400; font-size: 32px; color: #6b2a20; }
  #dialog .q { font-size: 18px; font-weight: 600; line-height: 1.6; margin: 6px 0 8px; }
  #dialog pre { margin: 6px 0 10px; font: 13px/1.6 ui-monospace, Menlo, monospace; background: rgba(43,34,25,0.08); padding: 8px 10px; border-left: 3px solid var(--ochre); white-space: pre-wrap; }
  .slips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 0 4px; }
  .slip { font: inherit; text-align: left; padding: 10px 12px; background: linear-gradient(90deg,#c9a76a,#e3c88f,#c9a76a); color: #2b2219; border: 1px solid #8d6a3a; border-radius: 3px 3px 10px 10px; cursor: pointer; font-size: 14px; line-height: 1.5; box-shadow: 0 4px 10px rgba(0,0,0,0.25); }
  .slip:hover { transform: translateY(-2px); }
  .slip small { display: block; font-size: 11px; color: #6e5230; }
  .slip.bad { background: #b8a888; opacity: 0.6; cursor: not-allowed; }
  .slip.good { outline: 3px solid var(--lamp); }
  .quote { border-top: 1px dashed rgba(110,82,46,0.5); margin-top: 12px; padding-top: 10px; font-size: 14px; line-height: 1.75; }
  .quote .k { color: var(--ochre); letter-spacing: 0.2em; font-size: 12px; }
  .trace { font-size: 13px; color: #7a2a20; line-height: 1.7; margin-top: 6px; }
  .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .shop img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid rgba(110,82,46,0.5); background: #2a1d14; }
  .price { font-size: 30px; font-weight: 900; color: var(--seal); }
  .say { font-size: 15px; line-height: 1.8; }
  @media (max-width: 640px) { .shop { grid-template-columns: 1fr; } .slips { grid-template-columns: 1fr; } #dossier { width: 200px; } }

  /* 回放播放器 */
  #player { position: fixed; inset: 0; background: rgba(4,5,7,0.86); z-index: 25; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; padding: 28px; }
  #player .main { display: flex; flex-direction: column; min-width: 0; }
  #player .ttl { font-size: 13px; color: #a99d86; letter-spacing: 0.3em; }
  #player h3 { margin: 2px 0 12px; font-family: var(--brush); font-weight: 400; font-size: 34px; color: #e3d3a8; }
  #player video { width: 100%; max-height: 72vh; background: #000; border: 1px solid #6e5a37; }
  #player .range { font-size: 13px; color: var(--lamp); margin-top: 8px; }
  #player .side { padding: 16px 16px 16px 30px; overflow-y: auto; }
  #player .ch { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; line-height: 28px; cursor: pointer; }
  #player .ch:hover { color: var(--seal); }
  @media (max-width: 860px) { #player { grid-template-columns: 1fr; } #player .side { max-height: 30vh; } }
</style>
</head>
<body>
<div id="screen" tabindex="0" aria-label="回放不夜城：第一人称 3D 场景">
  <canvas id="cv"></canvas>
  <div class="vignette"></div>
</div>
<div id="flash"></div>
<div class="watch" id="watch"><div class="plate" id="plate">子时</div><div class="meta" id="watchMeta"></div></div>
<div id="where">回放广场</div>
<div class="paper bound" id="dossier"></div>
<canvas id="mm" width="92" height="76" aria-hidden="true"></canvas>
<div id="ahead" hidden></div>
<div id="toast" hidden></div>
<div class="hint"><kbd>↑</kbd><kbd>↓</kbd>/<kbd>W</kbd><kbd>S</kbd> 前后 · <kbd>←</kbd><kbd>→</kbd>/<kbd>A</kbd><kbd>D</kbd> 转身 · <kbd>Q</kbd><kbd>E</kbd> 侧移 · 面对楼阁、铺子、门、惑影按前进交互</div>
<div id="fade"><span id="fadeText"></span></div>
<div id="modal" hidden><div class="paper bound" id="dialog" role="dialog" aria-modal="true"></div></div>
<div id="player" hidden>
  <div class="main"><div class="ttl" id="pTtl"></div><h3 id="pName"></h3><video id="video" controls playsinline></video><div class="range" id="pRange"></div>
    <div class="btns"><button class="btn dark" id="pClose" type="button">收起卷宗，回到城中（Esc）</button></div></div>
  <div class="paper bound side" id="pSide"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="v4-data.js"></script>
<script>
(() => {
  const D = window.PC_DATA, C = D.course, M2 = D.commerce;
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const CN = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
  const NUM = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];
  const SHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  if (!window.THREE) { document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;top:40%;width:100%;text-align:center">3D 引擎需要联网加载 Three.js，请检查网络后刷新。</p>'); return; }

  // ═════════════ Three.js 基础 ═════════════
  const WALL_H = 1.3, EYE = 0.56;
  const screenEl = $('#screen'), cv = $('#cv');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false });
  renderer.setPixelRatio(1);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(72, 16 / 10, 0.05, 90);
  camera.rotation.order = 'YXZ';

  function canvasTex(size, paint, repeat, h) {
    const c = document.createElement('canvas'); c.width = size; c.height = h || size;
    paint(c.getContext('2d'), size, h || size);
    const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
    if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;

  }
  const trnd = mulberry32(7);
  const wallTex = canvasTex(64, g => {
    g.fillStyle = '#231812'; g.fillRect(0, 0, 64, 8); g.fillStyle = '#b8975a'; g.fillRect(0, 7, 64, 1);
    g.fillStyle = '#26292c'; g.fillRect(0, 8, 64, 42);
    for (let r = 0; r < 6; r++) for (let b = -1; b < 5; b++) { const x = b * 16 + (r % 2 ? 8 : 0), s = 56 + Math.floor(trnd() * 14); g.fillStyle = 'rgb(' + (s - 2) + ',' + (s + 1) + ',' + (s + 5) + ')'; g.fillRect(x + 1, 9 + r * 7, 14, 6); }
    g.fillStyle = '#5c5a52'; g.fillRect(0, 50, 64, 14); g.fillStyle = '#6d6a60'; g.fillRect(0, 50, 64, 2); g.fillStyle = '#4b4943'; g.fillRect(0, 56, 64, 1); g.fillRect(0, 61, 64, 1);
  });
  const cityWallTex = canvasTex(64, g => { g.fillStyle = '#2a2d30'; g.fillRect(0, 0, 64, 64); for (let r = 0; r < 9; r++) for (let b = -1; b < 5; b++) { const x = b * 16 + (r % 2 ? 8 : 0), s = 66 + Math.floor(trnd() * 16); g.fillStyle = 'rgb(' + (s - 4) + ',' + (s - 2) + ',' + (s + 2) + ')'; g.fillRect(x + 1, r * 7 + 1, 14, 6); } });
  const floorTex = canvasTex(64, g => { g.fillStyle = '#1b1a17'; g.fillRect(0, 0, 64, 64); for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) { const v = Math.floor(trnd() * 10); g.fillStyle = 'rgb(' + (56 + v) + ',' + (53 + v) + ',' + (48 + v) + ')'; g.fillRect(c * 32 + 1, r * 32 + 1, 30, 30); g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(c * 32 + 1, r * 32 + 1, 30, 2); } });
  const plazaTex = canvasTex(64, g => { g.fillStyle = '#2a2622'; g.fillRect(0, 0, 64, 64); for (let r = 0; r < 4; r++) for (let c = 0; c < 2; c++) { const v = Math.floor(trnd() * 12); g.fillStyle = 'rgb(' + (74 + v) + ',' + (70 + v) + ',' + (64 + v) + ')'; g.fillRect(c * 32 + (r % 2 ? 16 : 0) + 1, r * 16 + 1, 30, 14); g.fillRect(c * 32 + (r % 2 ? 16 : 0) - 31, r * 16 + 1, 30, 14); } }, true);
  const ceilTex = canvasTex(32, g => { g.fillStyle = '#120d0b'; g.fillRect(0, 0, 32, 32); g.fillStyle = '#2a1d16'; g.fillRect(0, 14, 32, 4); g.fillRect(14, 0, 4, 32); g.fillStyle = '#1d2422'; g.fillRect(3, 3, 9, 9); g.fillRect(20, 3, 9, 9); g.fillRect(3, 20, 9, 9); g.fillRect(20, 20, 9, 9); g.fillStyle = '#b8975a'; g.fillRect(15, 15, 2, 2); });
  const latticeTex = canvasTex(64, g => { const gr = g.createRadialGradient(32, 30, 4, 32, 32, 40); gr.addColorStop(0, '#ffe2a8'); gr.addColorStop(1, '#c08848'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); g.fillStyle = '#3a2418'; g.fillRect(0, 0, 64, 4); g.fillRect(0, 60, 64, 4); g.fillRect(0, 0, 4, 64); g.fillRect(60, 0, 4, 64); for (let k = 12; k < 60; k += 10) { g.fillRect(k, 4, 2, 56); g.fillRect(4, k, 56, 2); } });
  const doorTex = (() => { const t = canvasTex(256, g => { g.fillStyle = '#3a2616'; g.fillRect(0, 0, 256, 256); g.fillStyle = '#2a1a0f'; for (let x = 0; x < 256; x += 32) g.fillRect(x, 0, 3, 256); g.fillStyle = '#1a100a'; g.fillRect(126, 0, 4, 256); g.fillStyle = '#b8975a'; [[40, 40], [216, 40], [40, 216], [216, 216], [108, 150], [148, 150]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 9, 0, 7); g.fill(); }); g.fillStyle = '#e8dcc0'; g.fillRect(78, 34, 100, 86); g.fillStyle = '#5a3b22'; g.fillRect(78, 30, 100, 8); g.fillRect(78, 118, 100, 8); g.fillStyle = '#a3312a'; g.font = '64px "Ma Shan Zheng", "STKaiti", serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('疑', 128, 80); }); t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; return t; })();
  const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
  const inkTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const r = mulberry32(5); for (let k = 0; k < 40; k++) { const x = 64 + (r() - 0.5) * 70, y = 64 + (r() - 0.5) * 70, rr = 10 + r() * 30; const gr = g.createRadialGradient(x, y, 0, x, y, rr); gr.addColorStop(0, 'rgba(8,8,10,0.85)'); gr.addColorStop(1, 'rgba(8,8,10,0)'); g.fillStyle = gr; g.fillRect(x - rr, y - rr, rr * 2, rr * 2); } return new THREE.CanvasTexture(c); })();
  const swirlTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.translate(64, 64); for (let k = 0; k < 5; k++) { g.rotate(Math.PI * 2 / 5); g.strokeStyle = 'rgba(240,228,200,0.75)'; g.lineWidth = 5; g.beginPath(); for (let a = 0; a < 5; a += 0.1) { const rr = a * 11; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.stroke(); } return new THREE.CanvasTexture(c); })();
  const moonTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); let gr = g.createRadialGradient(128, 128, 30, 128, 128, 128); gr.addColorStop(0, 'rgba(239,230,204,0.35)'); gr.addColorStop(1, 'rgba(239,230,204,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); gr = g.createRadialGradient(118, 116, 4, 128, 128, 52); gr.addColorStop(0, '#fbf5e3'); gr.addColorStop(1, '#dccfae'); g.fillStyle = gr; g.beginPath(); g.arc(128, 128, 50, 0, Math.PI * 2); g.fill(); return new THREE.CanvasTexture(c); })();
  const mountainTex = (() => { const c = document.createElement('canvas'); c.width = 1024; c.height = 256; const g = c.getContext('2d'); const layer = (base, amp, col, seed) => { const r = mulberry32(seed); const ph = [r() * 6, r() * 6, r() * 6]; g.fillStyle = col; g.beginPath(); g.moveTo(0, 256); for (let x = 0; x <= 1024; x += 8) { const t = x / 1024 * Math.PI * 2; const v = Math.sin(t * 2 + ph[0]) * 0.5 + Math.sin(t * 5 + ph[1]) * 0.3 + Math.sin(t * 11 + ph[2]) * 0.15; g.lineTo(x, base - amp * (0.55 + v * 0.5)); } g.lineTo(1024, 256); g.closePath(); g.fill(); }; layer(150, 110, 'rgba(60,70,74,0.55)', 3); layer(190, 90, 'rgba(42,50,50,0.85)', 9); layer(228, 60, 'rgba(24,28,28,1)', 17); g.fillStyle = '#141616'; g.fillRect(0, 236, 1024, 20); const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.repeat.set(3, 1); return t; })();
  function clothTex(c1, c2) { return canvasTex(64, g => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? c2 : c1; g.fillRect(i * 8, 0, 8, 64); } g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, 56, 64, 8); }); }
  const screenTex = new THREE.TextureLoader().load(D.screen);

  const M = {
    wall: new THREE.MeshLambertMaterial({ map: wallTex }), cityWall: new THREE.MeshLambertMaterial({ map: cityWallTex }),
    floor: new THREE.MeshLambertMaterial({ map: floorTex }), corridor: new THREE.MeshLambertMaterial({ map: floorTex, color: 0x8f8a80 }), ceil: new THREE.MeshLambertMaterial({ map: ceilTex }),

  // ═════════════ 弹窗 ═════════════
  const modal = $('#modal'), dialog = $('#dialog');
  function openModal(html) { dialog.innerHTML = html; modal.hidden = false; held.length = 0; const f = dialog.querySelector('button'); if (f) f.focus({ preventScroll: true }); }
  function closeModal() { modal.hidden = true; screenEl.focus({ preventScroll: true }); renderDossier(); }
  modal.addEventListener('click', ev => { if (ev.target === modal && !S?.reviving) closeModal(); });
  let toastTimer; function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600); }
  function flash() { const f = $('#flash'); f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 60); }
  function quoteHtml(it) { return '<div class="quote"><div class="k">讲 师 原 话 · 回 放 ' + fmt(it.source_time) + '</div>「' + esc(it.source_quote) + '」<div class="tiny" style="margin-top:4px">' + esc(it.explain) + '</div></div>'; }

  // 题目：竹签作答；onRight / onWrong 回调；答错一次划掉该签
  function askHtml(it, head) {
    const opts = shuffle(it.options.map((o, k) => ({ o, ok: k === 0 })));
    return { html: head + '<div class="q">' + esc(it.question) + '</div>' + (it.code ? '<pre>' + esc(it.code) + '</pre>' : '') +
      '<div class="slips">' + opts.map((x, k) => '<button class="slip" type="button" data-ok="' + (x.ok ? 1 : 0) + '"><small>' + '甲乙丙丁'[k] + '</small>' + esc(x.o) + '</button>').join('') + '</div><div id="fb"></div>', opts };
  }
  function bindSlips(it, onRight, onWrong) {
    dialog.querySelectorAll('.slip').forEach(b => b.onclick = () => {
      if (b.classList.contains('bad')) return;
      if (b.dataset.ok === '1') { b.classList.add('good'); setTimeout(onRight, 380); }
      else { b.classList.add('bad'); flash(); S.wrong.push(it); onWrong(); }
    });
  }
  function loseLamp() {
    S.lamps = Math.max(0, S.lamps - 1); renderDossier();
    if (S.lamps === 0) { setTimeout(openRevive, 600); return true; }
    return false;
  }
  function wrongFeedback(it) {
    $('#fb').innerHTML = '<div class="trace">灯灭一盏。再想想——</div>' + quoteHtml(it) + '<div class="btns"><button class="btn" type="button" id="rewatch">回看这 40 秒</button></div>';
    $('#rewatch').onclick = () => openPlayer({ src: C.video, title: C.replay.title, from: Math.max(0, it.source_time - 10), to: it.source_time + 30, sub: '回看 · ' + it.keyword });
  }

  // 门：疑问 + 道具
  function openDoor(e) {
    const roomName = CN[e.room + 1] + ' · ' + C.rooms[e.room].title;
    if (e.requires && !S.tools[e.requires]) {
      openModal('<h4>' + esc(roomName) + '</h4><h2>' + (e.requires === 'oil' ? '门后漆黑' : '铜锁封门') + '</h2><div class="say">' + (e.requires === 'oil' ? '门缝里透不出一丝光。没有灯油，进去也看不清门上的字。' : '门上一把铜锁，锁眼是鱼形。需要「铜鱼符」。') + '</div><div class="tiny" style="margin-top:8px">「' + TOOLS[e.requires].name + '」在前面某间密室的惑影身上。</div><div class="btns"><button class="btn" type="button" onclick="this.closest(\'#modal\').hidden=true">退后</button></div><div class="seal" style="right:16px;top:14px">锁</div>');
      return;
    }
    if (e.requires && !e.item) { // 只需道具的门（Boss 门）
      openModal('<h4>' + esc(roomName) + '</h4><h2>用「' + TOOLS[e.requires].name + '」开门</h2><div class="say">鱼符嵌入锁眼，铜锁「咔」地弹开。门后传来许多人同时发问的低语……</div><div class="btns"><button class="btn red" type="button" id="go">推门</button></div>');
      $('#go').onclick = () => { openDoorDone(e); closeModal(); }; return;
    }
    const tr = C.traces[e.room], it = e.item;
    const head = '<h4>' + esc(roomName) + ' · 门 上 疑 问</h4>' + (e.requires === 'oil' ? '<div class="tiny">点上灯油，门上的字显了出来。</div>' : '') +
      (tr && tr.wrong ? '<div class="trace">此门前有 ' + tr.wrong + ' 道血痕。直播时这一段的答题卡「' + esc(tr.question.slice(0, 28)) + '」，' + tr.total + ' 人作答、' + tr.wrong + ' 人答错：' + tr.samples.slice(0, 3).map(s => '「' + esc(s[0]) + '」选了 ' + esc(s[1])).join('，') + '</div>' : '');
    openModal(askHtml(it, head).html + '<div class="seal" style="right:16px;top:14px">疑</div>');

  }

  // 惑影 / 众惑
  function openFight(e) {
    const boss = e.type === 'boss';

    const head = boss ? '<h4>众 惑 · ' + esc(C.rooms[e.room].title) + '</h4><h2>众惑 ' + '◆'.repeat(e.hp) + '<span style="opacity:.3">' + '◆'.repeat(e.items.length - e.hp) + '</span></h2><div class="tiny">全场 ' + (C.traces[e.room]?.total || 0) + ' 人在此答题，' + Math.round((C.rooms[e.room].fail_rate || 0) * 100) + '% 答错。连破 ' + e.items.length + ' 问可散众惑。</div>'

  // ═════════════ 回放播放器 ═════════════
  const player = $('#player'), video = $('#video');
  let clipEnd = null;
  function openPlayer({ src, title, from, to, sub }) {

      : M2.products.map(p => '<div class="ch" data-t="' + p.start + '" data-e="' + p.end + '"><span>' + esc(p.name) + '</span><span>' + fmt(p.start) + '</span></div>').join('');

    player.hidden = false; held.length = 0;

  // ═════════════ 小地图 / 前方提示 ═════════════
  const mmEl = $('#mm'), mctx = mmEl.getContext('2d');
  function drawMinimap() {
    const T = 4, W = CUR; mctx.clearRect(0, 0, mmEl.width, mmEl.height);
    for (let y = 0; y < W.rows; y++) for (let x = 0; x < W.cols; x++) {
      if (mode === 'palace' && !W.seen[y * W.cols + x]) continue;
      const g = W.grid[y][x]; if (!g) continue;
      mctx.fillStyle = g === 2 ? '#3a3a3c' : mode === 'palace' ? (PW.roomOf[y][x] >= 0 ? '#5e5a50' : '#45423c') : '#4a4844'; mctx.fillRect(x * T, y * T, T, T);
    }
    W.entities.forEach(e => {
      const tiles = e.tiles || [[e.x, e.y]]; let c;
      if (mode === 'palace') { if (!W.seen[e.y * W.cols + e.x] || S.dead.includes(e.id) || S.opened.includes(e.id)) return; c = e.type === 'door' ? (e.requires ? '#a3312a' : '#e3c88f') : ({ mob: '#9a8a8a', boss: '#d9553a', npc: '#cfe0e0', portal: '#f0dfb6' })[e.type]; }
      else c = e.type === 'hall' ? (e.series.state === 'open' ? '#e3c88f' : '#6b5a3a') : e.type === 'shop' ? '#8fb3a8' : '#ffc070';
      mctx.fillStyle = c; tiles.forEach(([x, y]) => mctx.fillRect(x * T, y * T, T, T));
    });
    const cx = P.x * T, cy = P.z * T, a = -P.yaw, fx = Math.sin(a), fz = -Math.cos(a);
    mctx.fillStyle = '#fff3d0'; mctx.beginPath(); mctx.moveTo(cx + fx * 6, cy + fz * 6); mctx.lineTo(cx - fx * 3 + fz * 4, cy - fz * 3 - fx * 4); mctx.lineTo(cx - fx * 3 - fz * 4, cy - fz * 3 + fx * 4); mctx.closePath(); mctx.fill();
  }
  let lastAhead = '';
  function updateAhead() {
    let text = '';
    if (mv.t >= 1 && tn.t >= 1 && modal.hidden && player.hidden && !fading) {
      const p = pl(), [dx, dy] = DIRS[p.dir], e = blocker(p.px + dx, p.py + dy);
      if (e) text = ({
        hall: () => '前方：第' + CN[e.series.no] + '讲楼阁 · ' + (e.series.state === 'open' ? '按前进 · 看回放 / 入密室' : e.series.state === 'cleared' ? '已破' : '未开'),
        shop: () => '前方：' + e.name + ' · 伙计在张罗 · 按前进进店',
        door: () => e.requires && !S.tools[e.requires] ? '前方：' + (e.requires === 'oil' ? '暗门 · 需灯油' : '铜锁门 · 需铜鱼符') : '前方：门上有疑问 · 按前进作答',
        mob: () => '前方：惑影「' + e.item.keyword + '」· 按前进破之',
        boss: () => '前方：众惑 · 按前进迎战',
        npc: () => '前方：书生灯影 · 按前进请教',
        portal: () => S.tools.page ? '前方：月洞门 · 按前进出密室' : '前方：月洞门 · 需卷宗残页',
        deco: () => ''
      }[e.type] || (() => ''))();
    }
    if (text !== lastAhead) { lastAhead = text; const el = $('#ahead'); el.textContent = text; el.hidden = !text; }
  }

  // ═════════════ 主循环 ═════════════
  const held = []; let last = performance.now(), lastWatch = 0; const camPos = new THREE.Vector3();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
    if (mv.t < 1) { mv.t = Math.min(1, mv.t + dt / 0.22); const k = ease(mv.t); P.x = mv.fx + (mv.tx - mv.fx) * k; P.z = mv.fz + (mv.tz - mv.fz) * k; }
    if (tn.t < 1) { tn.t = Math.min(1, tn.t + dt / 0.2); P.yaw = tn.f + (tn.to - tn.f) * ease(tn.t); }
    if (bump.t < 1) bump.t = Math.min(1, bump.t + dt / 0.18);
    if (mv.t >= 1 && tn.t >= 1 && bump.t >= 1 && held.length && modal.hidden && player.hidden && !fading) doAction(held[held.length - 1]);
    const b = Math.sin(bump.t * Math.PI) * 0.1, bob = reduceMotion ? 0 : Math.sin(mv.t * Math.PI) * 0.025;
    camera.position.set(P.x + bump.dx * b, EYE + bob, P.z + bump.dz * b); camera.rotation.set(mode === 'surface' ? 0.03 : -0.05, P.yaw, 0); camPos.copy(camera.position);
    const flick = reduceMotion ? 0 : Math.sin(t * 11) * 0.06 + Math.sin(t * 23) * 0.04;
    hand.position.set(P.x, EYE + 0.15, P.z); if (mode === 'palace') hand.intensity = 1.35 + flick;
    CUR.lights.slice().sort((a, c) => ((a.wx - P.x) ** 2 + (a.wz - P.z) ** 2) - ((c.wx - P.x) ** 2 + (c.wz - P.z) ** 2)).slice(0, pool.length).forEach((lt, i) => { pool[i].position.set(lt.wx, (lt.wy || 0.9) - 0.05, lt.wz + 0.1); pool[i].intensity = 1.1 + (reduceMotion ? 0 : Math.sin(t * 9 + lt.seed) * 0.12); });
    CUR.lights.forEach(lt => { if (lt.flame) { const s = reduceMotion ? 1 : 1 + Math.sin(t * 7 + lt.seed) * 0.07; lt.flame.scale.set(0.5 * s, 0.5 * s, 1); } });
    if (mode === 'palace') {
      PW.entities.forEach(e => {
        if (!e.obj.visible) return;
        const face = () => { e.obj.rotation.y = Math.atan2(camPos.x - e.obj.position.x, camPos.z - e.obj.position.z); };
        if ((e.type === 'mob' || e.type === 'boss') && !S.dead.includes(e.id)) { face(); e.core.children.forEach(s => { if (s.isSprite) s.material.rotation = t * 0.3 + s.userData.ph; }); e.core.position.y = (e.type === 'boss' ? 0.8 : 0.6) + (reduceMotion ? 0 : Math.sin(t * 1.8 + e.x) * 0.05); }
        else if (e.type === 'npc') { face(); e.body.position.y = reduceMotion ? 0 : Math.sin(t * 2 + e.x) * 0.05; }
        else if (e.type === 'portal') { face(); e.disc.rotation.z = -t * (S.tools.page ? 2.4 : 0.4); e.ring.material.color.setHex(S.tools.page ? 0xe3c88f : 0x5a5f5c); }
      });
      const boss = PW.entities.find(e => e.type === 'boss'); bossLight.intensity = boss && !S.dead.includes('boss') ? 0.9 + Math.sin(t * 2) * 0.3 : 0;
      for (let i = anims.length - 1; i >= 0; i--) {
        const a = anims[i]; a.t += dt; const k = Math.min(1, a.t / 0.8);
        if (a.kind === 'door') { a.e.leaf.position.y = WALL_H / 2 + ease(k) * WALL_H; if (k >= 1) { a.e.obj.visible = false; anims.splice(i, 1); } }
        else { a.e.core.scale.setScalar(1 - ease(k)); a.e.glow.material.opacity = 0.35 * (1 - k); if (k >= 1) { a.e.obj.visible = false; anims.splice(i, 1); } }
      }
    }
    if (now - lastWatch > 1000) { lastWatch = now; if (!todManual && mode === 'surface') { const k = todOfHour(new Date().getHours()); if (k !== todKey) { todKey = k; applyTod(); } } updateWatch(); }
    renderer.render(scene, camera); drawMinimap(); updateAhead();
    requestAnimationFrame(frame);
  }
  function resize() { const w = innerWidth, h = innerHeight, iw = Math.round(Math.min(w * (devicePixelRatio || 1), 960)); renderer.setSize(iw, Math.round(iw * h / w), false); camera.aspect = w / h; camera.updateProjectionMatrix(); }

  // ═════════════ 输入 ═════════════
  const KEYS = { ArrowUp: 'fwd', w: 'fwd', W: 'fwd', ArrowDown: 'back', s: 'back', S: 'back', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', q: 'sl', Q: 'sl', e: 'sr', E: 'sr' };
  addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { if (!player.hidden) closePlayer(); else if (!modal.hidden && !S?.reviving) closeModal(); return; }
    const act = KEYS[ev.key]; if (!act || !modal.hidden || !player.hidden) return;
    ev.preventDefault(); if (!held.includes(act)) held.push(act);
  });
  addEventListener('keyup', ev => { const act = KEYS[ev.key]; if (!act) return; const i = held.indexOf(act); if (i >= 0) held.splice(i, 1); });
  addEventListener('blur', () => { held.length = 0; });

  // ═════════════ 启动 ═════════════
  buildSurface(); setMode('surface'); resize(); addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { labels.forEach(s => setLabel(s, s.userData.text)); vBanners.forEach(v => { v.mesh.material.map.dispose(); v.mesh.material.map = vTex(v.text, v.bg, v.fg); v.mesh.material.needsUpdate = true; }); });
  setTimeout(() => toast('北边是回放楼阁，转身往南是夜市铺子'), 600);
  screenEl.focus({ preventScroll: true });
  // 调试入口（演示与自动化测试用）：站到某扇门 / 某个实体前并面朝它
  function standBefore(id) {
    const e = CUR.entities.find(x => x.id === id); if (!e) return false;
    const p = pl();
    for (const [tx, ty] of e.tiles || [[e.x, e.y]]) for (let d = 0; d < 4; d++) {
      const [dx, dy] = DIRS[d], x = tx - dx, y = ty - dy;
      if (CUR.grid[y] && CUR.grid[y][x] === 1 && !blocker(x, y)) {
        p.px = x; p.py = y; p.dir = d; syncPlayer();
        if (mode === 'palace') { markSeen(x, y, 2); const r = PW.roomOf[y][x]; if (r >= 0) enterRoom(r); }
        return true;
      }
    }
    return false;
  }
  window.__pc = { give: k => { S.tools[k] = true; renderDossier(); }, lamps: n => { S.lamps = n; renderDossier(); }, standBefore, interactAhead: () => { const p = pl(), [dx, dy] = DIRS[p.dir], e = blocker(p.px + dx, p.py + dy); if (e) interact(e); return e && e.id; }, entities: () => PW.entities && PW.entities.map(e => e.id), enterPalace, openShop: i => openShop(SW.entities.find(e => e.id === 'shop' + i)), setTod: k => { todKey = k; todManual = true; applyTod(); renderDossier(); } };
  requestAnimationFrame(tt => { last = tt; frame(tt); });
})();
</script>
