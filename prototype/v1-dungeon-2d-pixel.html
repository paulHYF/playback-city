<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>回放地下城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Pixelify+Sans:wght@500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #111217;
    --panel: #1a1c23;
    --panel-2: #22252e;
    --line: #2f3340;
    --text: #ece3cf;
    --muted: #9b9484;
    --ember: #e8a245;
    --ember-2: #f5c97c;
    --blood: #d65a4e;
    --moss: #73b99c;
    --arcane: #a395f2;
    --display: "ZCOOL QingKe HuangYou", "Noto Sans SC", system-ui, sans-serif;
    --pixel: "Pixelify Sans", "JetBrains Mono", ui-monospace, monospace;
    --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  html, body { background: var(--bg); }
  body { color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.6; }
  .wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 32px; display: grid; gap: 16px; }

  /* top bar */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.1; letter-spacing: 0.04em; color: var(--ember-2); text-wrap: balance; }
  .brand h1 small { font-family: var(--pixel); font-size: 15px; color: var(--muted); letter-spacing: 0.08em; margin-left: 10px; }
  .course { margin-top: 4px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .course code { font-family: var(--mono); font-size: 12px; color: var(--text); }
  .hud { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .stat { display: grid; gap: 0; }
  .stat .k { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
  .stat .v { font-family: var(--pixel); font-size: 20px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .hearts { font-size: 18px; letter-spacing: 2px; }
  .hearts .on { color: var(--blood); }
  .hearts .off { color: #3a3d48; }
  .btn { font: inherit; font-size: 13px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 7px 12px; cursor: pointer; }
  .btn:hover { border-color: var(--ember); }
  .btn:focus-visible, .opt:focus-visible, .pad button:focus-visible { outline: 2px solid var(--ember-2); outline-offset: 2px; }
  .btn[aria-pressed="true"] { background: #3a2a1a; border-color: var(--ember); color: var(--ember-2); }
  .btn.primary { background: var(--ember); color: #1d1408; border-color: var(--ember); font-weight: 700; }
  .btn.primary:disabled { background: #4a4235; border-color: #4a4235; color: #8b8270; cursor: wait; }

  /* stage */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .game { display: grid; gap: 10px; min-width: 0; }
  .screen { position: relative; border: 2px solid #000; box-shadow: 0 0 0 1px var(--line); background: #07080b; }
  .screen canvas { display: block; width: 100%; height: auto; aspect-ratio: 640 / 448; image-rendering: pixelated; }
  .screen.shake { animation: shake 0.32s linear; }
  @keyframes shake { 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-4px, 1px); } 80% { transform: translate(3px, 0); } }
  .toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(10, 10, 14, 0.9); border: 1px solid var(--ember); color: var(--ember-2); padding: 6px 14px; font-size: 13px; border-radius: 3px; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 12.5px; }
  .hint kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; padding: 0 5px; border-radius: 3px; color: var(--text); }
  .pad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 40px); gap: 4px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .pad button { font-family: var(--pixel); font-size: 16px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; touch-action: none; }
  .pad button:active { background: #3a2a1a; border-color: var(--ember); }
  .pad .u { grid-column: 2; grid-row: 1; }
  .pad .l { grid-column: 1; grid-row: 2; }
  .pad .d { grid-column: 2; grid-row: 2; }
  .pad .r { grid-column: 3; grid-row: 2; }

  /* side panel */
  .panel { display: grid; gap: 14px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 14px; display: grid; gap: 8px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.1em; color: var(--muted); }
  .room-title { font-family: var(--display); font-size: 22px; line-height: 1.2; color: var(--ember-2); margin: 0; text-wrap: balance; }
  .room-time { font-family: var(--mono); font-size: 12px; color: var(--text); }
  .room-sum { margin: 0; color: #d6cdb9; font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 2px; color: var(--text); background: var(--panel-2); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 2px; }
  .tag.boss { background: #4a1f1b; color: #ffb3a8; }
  .tag.fog { background: #262838; color: #c7c2ff; }
  .tag.npc { background: #2b2546; color: #cfc6ff; }
  .tag.done { background: #1d3a2f; color: #a7e5c9; }
  .sources { display: grid; gap: 0; }
  .src { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); opacity: 0.38; transition: opacity 0.25s; }
  .src:first-child { border-top: 0; }
  .src.on { opacity: 1; }
  .src .dot { width: 8px; height: 8px; margin-top: 6px; background: var(--muted); }
  .src.on .dot { background: var(--ember); box-shadow: 0 0 8px var(--ember); }
  .src b { font-weight: 500; font-size: 13px; }
  .src .role { color: #d6cdb9; font-size: 12.5px; }
  .src .api { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
  .log { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; max-height: 190px; overflow-y: auto; display: grid; gap: 3px; color: #c9c1ad; }
  .log .t { color: var(--muted); margin-right: 6px; }
  .log .ok { color: var(--moss); }
  .log .warn { color: var(--ember-2); }
  .log .bad { color: #ff9b8f; }

  /* legend */
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .lg { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
  .lg canvas { width: 40px; height: 40px; image-rendering: pixelated; }
  .lg b { display: block; font-weight: 500; font-size: 13px; }
  .lg span { color: var(--muted); font-size: 12px; line-height: 1.45; display: block; }
  .foot { color: var(--muted); font-size: 12px; max-width: 75ch; }

  /* modal */
  .modal { position: fixed; inset: 0; background: rgba(5, 6, 9, 0.74); display: grid; place-items: center; z-index: 20; padding: 16px; }
  .dialog { width: min(580px, 100%); max-height: 88vh; overflow-y: auto; background: var(--panel); border: 1px solid #4a3d2a; border-radius: 4px; box-shadow: 0 0 0 2px #000, 0 24px 60px rgba(0, 0, 0, 0.6); padding: 18px; display: grid; gap: 12px; }
  .dialog h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.2; color: var(--ember-2); text-wrap: balance; }
  .dialog h3 { margin: 4px 0 0; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; }
  .dialog p { margin: 0; }
  .q { font-size: 15px; font-weight: 500; }
  pre.code { margin: 0; font-family: var(--mono); font-size: 13px; line-height: 1.6; background: #0d0e12; border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; overflow-x: auto; color: #e9e1cc; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { font-family: var(--mono); font-size: 13px; text-align: left; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; cursor: pointer; min-height: 44px; }
  .opt:hover:not(:disabled) { border-color: var(--ember); }
  .opt.right { border-color: var(--moss); background: #183026; color: #c8f0dd; }
  .opt.wrong { border-color: var(--blood); background: #3a1a17; color: #ffc3ba; text-decoration: line-through; }
  .opt:disabled { cursor: default; }
  .fb { font-size: 13.5px; padding: 10px 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel-2); }
  .fb.ok { border-color: #2f6b52; }
  .fb.bad { border-color: #7a322b; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .bossbar { display: flex; gap: 4px; }
  .bossbar i { flex: 1; height: 8px; background: var(--blood); }
  .bossbar i.gone { background: #3a2422; }
  .video { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: linear-gradient(160deg, #1d2230, #10131b); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .slide { position: absolute; inset: 8% 26% 22% 5%; background: #f3efe4; color: #22252e; border-radius: 2px; padding: 4% 5%; display: grid; align-content: start; gap: 6px; overflow: hidden; }
  .slide .st { font-weight: 700; font-size: clamp(11px, 2.4vw, 15px); }
  .slide pre { margin: 0; font-family: var(--mono); font-size: clamp(9px, 1.9vw, 12px); line-height: 1.5; white-space: pre-wrap; }
  .cam { position: absolute; right: 4%; top: 8%; width: 18%; aspect-ratio: 3 / 4; background: #2b3242; border-radius: 2px; display: grid; place-items: end center; overflow: hidden; }
  .cam::before { content: ""; position: absolute; top: 22%; left: 50%; width: 36%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: #c99f80; }
  .cam::after { content: ""; width: 78%; height: 34%; border-radius: 40% 40% 0 0; background: #3e5a7a; }
  .sub { position: absolute; left: 4%; right: 4%; bottom: 9%; text-align: center; font-size: clamp(11px, 2.5vw, 15px); color: #fff; text-shadow: 0 1px 2px #000, 0 0 6px #000; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255, 255, 255, 0.15); }
  .bar i { display: block; height: 100%; width: 0; background: var(--ember); }
  .vt { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .chat { display: grid; gap: 6px; }
  .msg { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; font-size: 13px; padding: 6px 10px; background: var(--panel-2); border-radius: 3px; }
  .msg .n { color: var(--arcane); }
  .msg .tm { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .answer { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px; background: #201d33; border: 1px solid #3d3566; border-radius: 3px; }
  .avatar { width: 64px; aspect-ratio: 3 / 4; border-radius: 3px; background: linear-gradient(#4b3f8c, #2a2350); position: relative; overflow: hidden; }
  .avatar::before { content: ""; position: absolute; top: 18%; left: 50%; width: 42%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: #e2bd9c; }
  .avatar::after { content: ""; position: absolute; bottom: 0; left: 12%; right: 12%; height: 36%; border-radius: 40% 40% 0 0; background: #a395f2; }
  .note { font-size: 12px; color: var(--muted); }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .grid4 > div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; }
  .grid4 .v { font-family: var(--pixel); font-size: 22px; font-variant-numeric: tabular-nums; color: var(--ember-2); }
  .grid4 .k { font-size: 11px; color: var(--muted); }
  .review { display: grid; gap: 6px; }
  .review > div { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; padding: 8px 10px; background: var(--panel-2); border-radius: 3px; }
  .review b { font-weight: 500; }
  .review .when { font-family: var(--mono); font-size: 11.5px; color: var(--moss); }

  @media (max-width: 900px) {
    .stage { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 520px) {
    .brand h1 { font-size: 28px; }
    .opts { grid-template-columns: 1fr; }
    .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen.shake { animation: none; }
    .src { transition: none; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>回放地下城<small>REPLAY DUNGEON</small></h1>
      <div class="course">
        <span id="courseTitle"></span>
        <span>频道 <code id="courseCh"></code></span>
        <span id="courseMeta"></span>
      </div>
    </div>
    <div class="hud">
      <div class="stat"><span class="k">生命</span><span class="v hearts" id="hpView"></span></div>
      <div class="stat"><span class="k">经验</span><span class="v" id="xpView">0</span></div>
      <div class="stat"><span class="k">已清理房间</span><span class="v" id="roomView">0 / 6</span></div>
      <button class="btn" id="teacherBtn" type="button" aria-pressed="false">讲师视角：全班卡关热力</button>
      <button class="btn" id="resetBtn" type="button">重新开始</button>
    </div>
  </header>

  <main class="stage">
    <section class="game">
      <div class="screen" id="screen">
        <canvas id="cv" width="640" height="448" aria-label="地下城地图，方向键移动，撞到怪物开始答题"></canvas>
        <div class="toast" id="toast" hidden></div>
      </div>
      <div class="controls">
        <p class="hint">方向键 / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动，撞上怪物开始答题。打败 Boss 后去最后一个房间的传送门结算。</p>
        <div class="pad" aria-label="方向键">
          <button class="u" type="button" data-dir="0,-1" aria-label="上">▲</button>
          <button class="l" type="button" data-dir="-1,0" aria-label="左">◀</button>
          <button class="d" type="button" data-dir="0,1" aria-label="下">▼</button>
          <button class="r" type="button" data-dir="1,0" aria-label="右">▶</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="card" id="roomCard"></div>
      <div class="card">
        <div class="eyebrow">这个房间由哪些数据生成</div>
        <div class="sources" id="sources"></div>
      </div>
      <div class="card">
        <div class="eyebrow">数据流</div>
        <div class="log" id="log" aria-live="polite"></div>
      </div>
    </aside>
  </main>

  <section class="legend" id="legend"></section>

  <p class="foot">示例数据：模拟一节 72 分钟的 Python 直播课回放（大纲、字幕、聊天、观看记录、答题卡统计都是按公开 OpenAPI 的数据形态编的）。正式版把这些数据换成接口实时拉取即可；「答题卡作答统计」用哪个接口取数还需要核对。</p>

  <div class="modal" id="modal" hidden>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>
</div>

<script>
(() => {
  // ───────────── 示例数据（形态对齐公开 OpenAPI） ─────────────
  const DATA = {
    course: { channelId: '3958201', title: 'Python 入门 · 第 3 课：列表、字典与循环', teacher: '林老师', date: '2026-10-12 20:00', duration: 4320, students: 186 },
    // 查询暂存视频大纲：outlineContent[]
    outline: [
      { title: '开场：为什么需要数据结构', start: 0, end: 400, summary: '用「存全班 50 人成绩」的例子引出问题：变量一多就没法批量处理，需要把数据装进一个容器。', keyword: ['数据结构', '列表'] },
      { title: '列表的创建与索引', start: 400, end: 1155, summary: '列表用方括号创建，下标从 0 开始；负索引从末尾往回数；切片取一段，包含起点不包含终点。', keyword: ['索引', '负索引', '切片'] },
      { title: '列表的增删改', start: 1155, end: 1910, summary: 'append 在末尾加一个元素，pop 删除并返回元素；列表是可变对象，两个变量可能指向同一个列表。', keyword: ['append', 'pop', '可变'] },
      { title: '字典：键值对', start: 1910, end: 2730, summary: '字典用键找值。方括号取不存在的键会抛 KeyError，get 可以给默认值；键必须是不可变类型。', keyword: ['KeyError', 'get', '键'] },
      { title: 'for 循环遍历', start: 2730, end: 3490, summary: 'range 生成数字序列，enumerate 同时拿下标和元素，items 遍历字典的键值对。', keyword: ['range', 'enumerate', 'items'] },
      { title: '综合练习：统计词频', start: 3490, end: 4320, summary: '用字典计数，再按出现次数排序，找出一段文字里最常出现的词。', keyword: ['计数', '排序'] }
    ],
    // 查询观看记录：这位同学在 45:30–58:10 离开了直播间
    watched: [[0, 2730], [3490, 4320]],
    // 答题卡作答统计：每段相关题目的全班错误率（%）
    failRate: [8, 24, 17, 62, 41, 29],
    // 聊天记录 + 提问记录聚类出的高频问题
    clusters: [
      { seg: 1, count: 27, q: 'a[-1] 到底是哪一个？负数索引从哪开始数？',
        msgs: [['阿杰', '老师 -1 是倒数第一个吗', '12:41'], ['Mia', '负数索引从哪开始数啊', '12:44'], ['土豆', 'a[-0] 是什么？', '12:50']],
        answer: '负索引从末尾往回数：a[-1] 是最后一个，a[-2] 是倒数第二个，等价于 a[len(a) - 1]。另外 -0 就是 0，所以 a[-0] 取到的是第一个。' },
      { seg: 3, count: 34, q: 'd.get("k") 和 d["k"] 有什么区别？',
        msgs: [['小周', 'get 和 [] 有啥区别', '37:02'], ['Kevin', '为啥我这报 KeyError', '37:15'], ['奶茶三分糖', 'get 第二个参数是干嘛的', '38:40']],
        answer: '键不存在时，d["k"] 直接抛 KeyError；d.get("k") 返回 None，d.get("k", 0) 返回你给的默认值 0。你希望程序报错还是给个默认值，决定了用哪一个。这也是 Boss 的弱点。' }
    ],
    // 题目：由智能字幕片段 + 大纲关键词生成；opts[0] 为正确答案，展示时打乱
    questions: [
      { id: 'q01', seg: 0, kw: '数据结构', t: 212, q: '用 s1、s2 … s50 五十个变量存全班成绩，最大的麻烦是什么？', code: '',
        opts: ['没法用循环批量处理，求平均分要写 50 遍', '变量名里不能带数字', 'Python 最多只能有 32 个变量', '会让程序明显变慢'],
        why: '变量一多就没法统一处理。把同类数据放进一个列表，一个循环就能处理全部。',
        subs: [[-16, '假设我们要存全班五十个同学的成绩'], [-6, '按前两节课学的，你得写 s1、s2，一直写到 s50'], [4, '那要算个平均分怎么办？五十个变量挨个加'], [13, '这就是今天要解决的问题：把同类数据装进一个容器']] },
      { id: 'q02', seg: 0, kw: '列表', t: 318, q: '下面哪个是合法的 Python 列表？', code: '',

      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) { grid[yy][xx] = 1; roomOf[yy][xx] = i; }

  function spr(c, rows, pal, x, y, scale, flip) {

  // ───────────── 渲染 ─────────────

        if (!S.seenNpc.includes(e.id)) {
          ctx.fillStyle = '#ffd76a';
          ctx.fillRect(sx + 14, sy - 14 + bob, 4, 8); ctx.fillRect(sx + 14, sy - 4 + bob, 4, 3);
        }
      } else if (e.type === 'portal') {
        const on = S.dead.includes('boss');
        for (let k = 0; k < 3; k++) {
          const ph = (t * (on ? 1.4 : 0.4) + k / 3) % 1;
          ctx.strokeStyle = on ? 'rgba(163,149,242,' + (1 - ph) + ')' : 'rgba(120,120,135,' + (0.6 - ph * 0.5) + ')';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.ellipse(sx + 16, sy + 18, 6 + ph * 12, 3 + ph * 6, 0, 0, Math.PI * 2); ctx.stroke();
        }
      }
    });
    // 玩家
    spr(ctx, SPR.player, PAL.player, P.rx * TILE - camX, P.ry * TILE - camY, 4, P.face < 0);
    // 粒子
    particles.forEach(p => { ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, p.life); ctx.fillRect(p.x - camX, p.y - camY, 4, 4); });
    ctx.globalAlpha = 1;
    // 迷雾房间
    FOG_ROOMS.forEach(ri => {
      if (S.explored.includes(ri)) return;
      const r = rooms[ri];
      const rx = r.x * TILE - camX, ry = r.y * TILE - camY;
      ctx.fillStyle = '#0b0c12'; ctx.fillRect(rx, ry, r.w * TILE, r.h * TILE);
      for (let k = 0; k < 40; k++) {
        const px = (k * 97 + t * (reduceMotion ? 0 : 14) * (k % 3 + 1)) % (r.w * TILE);
        const py = (k * 53) % (r.h * TILE);
        ctx.fillStyle = 'rgba(163,149,242,0.10)'; ctx.fillRect(rx + px, ry + py, 14, 3);
      }
    });

    // 光照
    lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, W, H);
    lctx.fillStyle = S.teacher ? 'rgba(6,7,10,0.30)' : 'rgba(6,7,10,0.88)';
    lctx.fillRect(0, 0, W, H);
    lctx.globalCompositeOperation = 'destination-out';
    S.visited.forEach(ri => {
      const r = rooms[ri];
      lctx.fillStyle = 'rgba(0,0,0,0.5)';
      lctx.fillRect((r.x - 1) * TILE - camX, (r.y - 1) * TILE - camY, (r.w + 2) * TILE, (r.h + 2) * TILE);
    });
    const light = (x, y, rad, a) => {
      const gr = lctx.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, 'rgba(0,0,0,' + a + ')'); gr.addColorStop(0.6, 'rgba(0,0,0,' + a * 0.8 + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = gr; lctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    };
    light(P.rx * TILE - camX + 16, P.ry * TILE - camY + 16, 175, 1);
    torches.forEach(tc => light(tc.x * TILE - camX + 16, tc.y * TILE - camY + 14, 78 + (reduceMotion ? 0 : Math.sin(t * 7 + tc.seed) * 5), 0.75));
    ctx.drawImage(lc, 0, 0);

    // 标签（画在光照之上，只在去过的房间显示）
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    entities.forEach(e => {
      if (S.dead.includes(e.id) || fogged(e.room) || !S.visited.includes(e.room)) return;
      const sx = e.x * TILE - camX + 16, sy = e.y * TILE - camY;
      let label, fg, bg;
      if (e.type === 'mob') { label = e.kw; fg = '#f2e9d5'; bg = 'rgba(15,15,20,0.85)'; }
      else if (e.type === 'boss') { label = 'BOSS · ' + e.kw + ' ' + '♥'.repeat(S.bossHp); fg = '#ffc0b6'; bg = 'rgba(60,18,15,0.92)'; }
      else if (e.type === 'npc') { label = e.cluster.count + ' 人问过'; fg = '#d9d2ff'; bg = 'rgba(35,28,70,0.92)'; }
      else { label = S.dead.includes('boss') ? '传送门：结算' : '传送门（未激活）'; fg = '#d9d2ff'; bg = 'rgba(25,22,45,0.9)'; }
      ctx.font = '500 11px "Noto Sans SC", sans-serif';
      const w = ctx.measureText(label).width + 10;
      const ly = e.type === 'boss' ? sy - 22 : sy - 9;
      ctx.fillStyle = bg; ctx.fillRect(sx - w / 2, ly - 8, w, 16);
      ctx.fillStyle = fg; ctx.fillText(label, sx, ly + 1);
    });
    FOG_ROOMS.forEach(ri => {
      if (S.explored.includes(ri)) return;
      const r = rooms[ri], seg = DATA.outline[ri];
      const cx = (r.x + r.w / 2) * TILE - camX, cy = (r.y + r.h / 2) * TILE - camY;
      ctx.fillStyle = '#a395f2'; ctx.font = '700 40px "Pixelify Sans", monospace'; ctx.fillText('?', cx, cy - 14);
      ctx.font = '500 12px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#c9c2f5';
      ctx.fillText('你没看过 ' + fmt(seg.start) + '–' + fmt(seg.end), cx, cy + 18);
    });
    // 讲师视角
    if (S.teacher) {
      rooms.forEach(r => {
        const rate = DATA.failRate[r.i];
        const rx = r.x * TILE - camX, ry = r.y * TILE - camY, w = r.w * TILE, h = r.h * TILE;
        ctx.fillStyle = 'rgba(214,90,78,' + (rate / 100 * 0.62) + ')'; ctx.fillRect(rx, ry, w, h);
        ctx.strokeStyle = 'rgba(255,190,170,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(rx + 0.5, ry + 0.5, w - 1, h - 1);
        ctx.fillStyle = '#fff3e6';
        ctx.font = '400 26px "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif';
        ctx.fillText('卡关 ' + rate + '%', rx + w / 2, ry + h / 2 - 10);
        ctx.font = '500 12px "Noto Sans SC", sans-serif';
        ctx.fillText(Math.round(rate / 100 * DATA.course.students) + ' / ' + DATA.course.students + ' 人 · ' + DATA.outline[r.i].title, rx + w / 2, ry + h / 2 + 16);
      });
    }
  }

  // ───────────── 循环与移动 ─────────────
  const held = [];
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const sp = 10 * dt;
    const dx = S.px - P.rx, dy = S.py - P.ry;
    const d = Math.hypot(dx, dy);
    if (d <= sp) { P.rx = S.px; P.ry = S.py; } else { P.rx += dx / d * sp; P.ry += dy / d * sp; }
    const moving = P.rx !== S.px || P.ry !== S.py;
    if (!moving && held.length && $('#modal').hidden) tryMove(...held[held.length - 1]);
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.life -= dt * 1.4; });
    particles = particles.filter(p => p.life > 0);
    draw(now);
    requestAnimationFrame(frame);
  }

  function entityAt(x, y) { return entities.find(e => e.x === x && e.y === y && !S.dead.includes(e.id)); }

  function tryMove(dx, dy) {
    if (dx) P.face = dx;
    const nx = S.px + dx, ny = S.py + dy;
    if (ny < 0 || ny >= ROWS || nx < 0 || nx >= COLS || grid[ny][nx] !== 1) return;
    const r = roomOf[ny][nx];
    if (r >= 0 && FOG_ROOMS.includes(r) && !S.explored.includes(r)) { held.length = 0; openExplore(r); return; }
    const e = entityAt(nx, ny);
    if (e) { held.length = 0; interact(e); return; }
    S.px = nx; S.py = ny;
    if (r >= 0) enterRoom(r);
  }

  function enterRoom(r) {
    if (!S.visited.includes(r)) {
      S.visited.push(r);
      const seg = DATA.outline[r];
      addLog('进入第 ' + (r + 1) + ' 段「' + seg.title + '」' + fmt(seg.start) + '–' + fmt(seg.end));
    }
    if (r !== curRoom) { curRoom = r; renderPanel(r); }
  }

  function interact(e) {
    if (e.type === 'mob' || e.type === 'boss') openBattle(e);
    else if (e.type === 'npc') openNpc(e);
    else if (e.type === 'portal') {
      if (S.dead.includes('boss')) openResult();
      else toast('传送门还没激活：先打败第 ' + (BOSS_ROOM + 1) + ' 段的 Boss');
    }
  }

  // ───────────── 面板 / HUD / 日志 ─────────────
  function roomCleared(i) { return entities.filter(e => e.room === i && (e.type === 'mob' || e.type === 'boss')).every(e => S.dead.includes(e.id)); }
  function updateHud() {
    $('#hpView').innerHTML = Array.from({ length: 5 }, (_, i) => '<span class="' + (i < S.hp ? 'on' : 'off') + '">♥</span>').join('');
    $('#xpView').textContent = S.xp;
    $('#roomView').textContent = rooms.filter(r => roomCleared(r.i)).length + ' / ' + rooms.length;
    $('#teacherBtn').setAttribute('aria-pressed', String(S.teacher));
  }
  function renderPanel(i) {
    const seg = DATA.outline[i];
    const tags = [];
    if (i === BOSS_ROOM) tags.push('<span class="tag boss">Boss 房 · 全班错误率 ' + DATA.failRate[i] + '%</span>');
    if (FOG_ROOMS.includes(i)) tags.push('<span class="tag fog">' + (S.explored.includes(i) ? '迷雾已点亮' : '你没看过这段') + '</span>');
    if (DATA.clusters.some(c => c.seg === i)) tags.push('<span class="tag npc">有高频提问 NPC</span>');
    if (roomCleared(i)) tags.push('<span class="tag done">已清理</span>');
    $('#roomCard').innerHTML =
      '<div class="eyebrow">当前房间 · 大纲第 ' + (i + 1) + ' / ' + DATA.outline.length + ' 段</div>' +
      '<h2 class="room-title">' + esc(seg.title) + '</h2>' +
      '<div class="room-time">回放 ' + fmt(seg.start) + ' – ' + fmt(seg.end) + '</div>' +
      (tags.length ? '<div class="chips">' + tags.join('') + '</div>' : '') +
      '<p class="room-sum">' + esc(seg.summary) + '</p>' +
      '<div class="chips">' + seg.keyword.map(k => '<span class="chip">' + esc(k) + '</span>').join('') + '</div>';
    const on = new Set(['outline', 'subtitle']);
    if (DATA.clusters.some(c => c.seg === i)) { on.add('chat'); on.add('avatar'); }
    if (i === BOSS_ROOM) on.add('quiz');
    if (FOG_ROOMS.includes(i)) on.add('viewlog');
    if (i === LAST_ROOM) on.add('marker');
    $('#sources').innerHTML = SOURCES.map(s =>
      '<div class="src' + (on.has(s.key) ? ' on' : '') + '"><span class="dot"></span><div><b>' + esc(s.name) + '</b>' +
      '<div class="role">' + esc(s.role) + '</div><div class="api">' + esc(s.api) + '</div></div></div>').join('');
  }
  function addLog(text, kind) {
    const d = new Date();
    const el = document.createElement('div');
    el.innerHTML = '<span class="t">' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0') + '</span><span class="' + (kind || '') + '">' + esc(text) + '</span>';
    const log = $('#log');
    log.prepend(el);
    while (log.children.length > 60) log.lastChild.remove();
  }
  let toastTimer;
  function toast(text) {
    const el = $('#toast'); el.textContent = text; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
  }
  function shake() { const s = $('#screen'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }
  function burst(e, colors) {
    for (let k = 0; k < 28; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
      particles.push({ x: e.x * TILE + 16, y: e.y * TILE + 16, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 1, c: colors[k % colors.length] });
    }
  }

  // ───────────── 弹窗 ─────────────
  const modal = $('#modal'), dialog = $('#dialog');
  function openModal(html) { dialog.innerHTML = html; modal.hidden = false; held.length = 0; const f = dialog.querySelector('button'); if (f) f.focus({ preventScroll: true }); }
  function closeModal() { modal.hidden = true; cv.focus({ preventScroll: true }); }

  function openBattle(e) {
    const isBoss = e.type === 'boss';
    const qi = isBoss ? 3 - S.bossHp : 0;
    const q = Q[e.qids[qi]], seg = DATA.outline[e.room];
    const opts = shuffle(q.opts.map((o, i) => ({ o, ok: i === 0 })));
    openModal(
      '<div class="eyebrow">' + (isBoss ? 'BOSS 房 · 全班错误率 ' + DATA.failRate[e.room] + '% · 第 ' + (qi + 1) + ' / 3 击' : '关键词怪') + ' · 大纲第 ' + (e.room + 1) + ' 段 ' + fmt(seg.start) + '–' + fmt(seg.end) + '</div>' +
      '<h2>' + esc(isBoss ? e.kw : '「' + e.kw + '」史莱姆') + '</h2>' +
      (isBoss ? '<div class="bossbar">' + [0, 1, 2].map(k => '<i class="' + (k < 3 - S.bossHp ? 'gone' : '') + '"></i>').join('') + '</div>' : '') +
      '<p class="q">' + esc(q.q) + '</p>' +
      (q.code ? '<pre class="code">' + esc(q.code) + '</pre>' : '') +
      '<div class="opts">' + opts.map((x, i) => '<button class="opt" type="button" data-i="' + i + '">' + esc(x.o) + '</button>').join('') + '</div>' +
      '<div id="fb" hidden></div>' +
      '<div class="actions" id="acts"><button class="btn" type="button" id="flee">先撤退</button></div>'
    );
    $('#flee').onclick = closeModal;
    dialog.querySelectorAll('.opt').forEach(btn => btn.onclick = () => {
      const pick = opts[Number(btn.dataset.i)];
      const fb = $('#fb');
      S.answered++;
      if (pick.ok) {
        S.correct++;
        btn.classList.add('right');
        dialog.querySelectorAll('.opt').forEach(b => b.disabled = true);
        fb.className = 'fb ok'; fb.hidden = false;
        if (isBoss) {
          S.bossHp--;
          if (S.bossHp > 0) {
            fb.innerHTML = '<b>命中！</b>Boss 还剩 ' + S.bossHp + ' 点血。' + esc(q.why);
            $('#acts').innerHTML = '<button class="btn primary" type="button" id="nx">下一击</button>';
            $('#nx').onclick = () => openBattle(e);
            addLog('Boss 受到一击：' + q.kw, 'ok');
          } else {
            fb.innerHTML = '<b>Boss 倒下了！+100 XP</b> ' + esc(q.why) + ' 传送门已在第 ' + (LAST_ROOM + 1) + ' 段的房间激活。';
            $('#acts').innerHTML = '<button class="btn primary" type="button" id="nx">继续</button>';
            $('#nx').onclick = closeModal;
            defeat(e, 100);
          }
        } else {
          fb.innerHTML = '<b>击败！+20 XP</b> ' + esc(q.why);
          $('#acts').innerHTML = '<button class="btn primary" type="button" id="nx">继续</button>';
          $('#nx').onclick = closeModal;
          defeat(e, 20);
        }
        $('#nx').focus({ preventScroll: true });
      } else {
        btn.classList.add('wrong'); btn.disabled = true;
        S.hp = Math.max(0, S.hp - 1);
        if (!S.wrong.includes(q.id)) S.wrong.push(q.id);
        shake(); updateHud();
        fb.className = 'fb bad'; fb.hidden = false;
        fb.innerHTML = '<b>−1 ♥ 不对。</b>老师在回放 ' + fmt(q.t) + ' 讲过这个点。';
        addLog('答错「' + q.kw + '」→ 记录错题，回放锚点 ' + fmt(q.t), 'bad');
        if (S.hp <= 0) setTimeout(() => openReplay(q), 650);
      }
      updateHud();
    });
  }

  function defeat(e, xp) {
    S.dead.push(e.id); S.xp += xp;
    burst(e, e.type === 'boss' ? ['#ff8a7a', '#ffd76a', '#c2413a'] : [e.color, '#f4f0e6', '#ffd76a']);
    addLog((e.type === 'boss' ? '击败 Boss「' + e.kw + '」' : '击败关键词怪「' + e.kw + '」') + ' +' + xp + ' XP', 'ok');
    if (roomCleared(e.room)) addLog('第 ' + (e.room + 1) + ' 段房间已清理', 'ok');
    updateHud(); renderPanel(e.room);
  }

  function openReplay(q) {
    S.falls++;
    const seg = DATA.outline[q.seg];
    const t0 = q.t - 20, t1 = q.t + 20, DUR = 6500;
    openModal(
      '<div class="eyebrow">生命耗尽 · 复活条件</div>' +
      '<h2>回到回放里，补上这 40 秒</h2>' +
      '<p class="note">第 ' + (q.seg + 1) + ' 段「' + esc(seg.title) + '」。演示按 6 倍速播放；正式版用播放器 SDK 跳到 ' + fmt(t0) + ' 正常播放 40 秒。</p>' +
      '<div class="video"><div class="slide"><div class="st">' + esc(seg.title) + '</div>' + (q.code ? '<pre>' + esc(q.code) + '</pre>' : '<pre>' + esc(seg.summary) + '</pre>') + '</div>' +
      '<div class="cam"></div><div class="sub" id="sub"></div><div class="bar"><i id="barI"></i></div></div>' +
      '<div class="vt"><span id="vcur">' + fmt(t0) + '</span><span>' + fmt(t1) + '</span></div>' +
      '<div class="actions"><button class="btn primary" type="button" id="revive" disabled>播放中…</button></div>'
    );
    const start = performance.now();
    const tick = () => {
      if (modal.hidden) return;
      const p = Math.min(1, (performance.now() - start) / DUR);
      const cur = t0 + (t1 - t0) * p;
      $('#barI').style.width = (p * 100) + '%';
      $('#vcur').textContent = fmt(cur);
      const line = q.subs.filter(([o]) => q.t + o <= cur).pop();
      $('#sub').textContent = line ? line[1] : '';
      if (p < 1) requestAnimationFrame(tick);
      else {
        const b = $('#revive'); b.disabled = false; b.textContent = '复活（♥ × 3）';
        b.onclick = () => { S.hp = 3; updateHud(); addLog('看完回放 ' + fmt(t0) + '–' + fmt(t1) + ' → 复活', 'warn'); closeModal(); };
        b.focus({ preventScroll: true });
      }
    };
    requestAnimationFrame(tick);
    addLog('倒下 → 回放 ' + fmt(t0) + '–' + fmt(t1) + '（智能字幕片段）', 'warn');
  }

  function openExplore(ri) {
    const seg = DATA.outline[ri];
    const qs = DATA.questions.filter(q => q.seg === ri);
    openModal(
      '<div class="eyebrow">迷雾房间 · 来自观看记录</div>' +
      '<h2>这一段你还没看过</h2>' +
      '<p>观看记录显示，你在 <b>' + fmt(seg.start) + '–' + fmt(seg.end) + '</b> 离开了直播间，错过了「' + esc(seg.title) + '」。先读完这段的大纲，才能进去。</p>' +
      '<h3>AI 大纲摘要</h3><p>' + esc(seg.summary) + '</p>' +
      '<h3>老师原话（智能字幕节选）</h3>' +
      '<div class="chat">' + qs.map(q => '<div class="msg"><span class="tm">' + fmt(q.t + q.subs[2][0]) + '</span><span>' + esc(q.subs[2][1]) + '</span><span></span></div>').join('') + '</div>' +
      '<div class="chips">' + seg.keyword.map(k => '<span class="chip">' + esc(k) + '</span>').join('') + '</div>' +
      '<div class="actions"><button class="btn" type="button" id="later">等会儿再来</button><button class="btn primary" type="button" id="lit" disabled>阅读中…</button></div>'
    );
    $('#later').onclick = closeModal;
    setTimeout(() => {
      const b = $('#lit'); if (!b) return;
      b.disabled = false; b.textContent = '读完了，点亮房间';
      b.onclick = () => { S.explored.push(ri); S.xp += 10; addLog('点亮迷雾：第 ' + (ri + 1) + ' 段 +10 XP', 'ok'); updateHud(); renderPanel(curRoom >= 0 ? curRoom : ri); closeModal(); };
    }, 1800);
  }

  function openNpc(e) {
    const c = e.cluster, seg = DATA.outline[c.seg];
    const first = !S.seenNpc.includes(e.id);
    openModal(
      '<div class="eyebrow">隐藏 NPC · 来自聊天记录和提问记录</div>' +
      '<h2>' + c.count + ' 位同学问过同一个问题</h2>' +
      '<p class="q">' + esc(c.q) + '</p>' +
      '<h3>直播时聊天室里的原话</h3>' +
      '<div class="chat">' + c.msgs.map(([n, m, tm]) => '<div class="msg"><span class="n">' + esc(n) + '</span><span>' + esc(m) + '</span><span class="tm">' + tm + '</span></div>').join('') + '</div>' +
      '<h3>数字人' + esc(DATA.course.teacher) + '的回答</h3>' +
      '<div class="answer"><div class="avatar" aria-hidden="true"></div><p>' + esc(c.answer) + '</p></div>' +
      '<p class="note">正式版：赛前用视频创作接口为每个高频问题生成一段 15 秒的数字人讲解。本段时间范围 ' + fmt(seg.start) + '–' + fmt(seg.end) + '。</p>' +
      '<div class="actions"><button class="btn primary" type="button" id="ok">' + (first ? '记住了（+10 XP）' : '关闭') + '</button></div>'
    );
    $('#ok').onclick = () => {
      if (first) { S.seenNpc.push(e.id); S.xp += 10; addLog('听完 NPC 讲解：' + c.q.slice(0, 16) + '… +10 XP', 'ok'); updateHud(); }
      closeModal();
    };
  }

  function openResult() {
    const acc = S.answered ? Math.round(S.correct / S.answered * 100) : 0;
    const secs = Math.round((Date.now() - S.startedAt) / 1000);
    const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
    const wrong = S.wrong.map(id => Q[id]);
    const markers = wrong.map(q => ({ time: q.t, desc: '你在这里倒下过：' + q.kw }));
    openModal(
      '<div class="eyebrow">通关结算</div>' +
      '<h2>第 3 课地下城已通关</h2>' +
      '<div class="grid4">' +
        '<div><div class="v">' + acc + '%</div><div class="k">答题正确率</div></div>' +
        '<div><div class="v">' + S.falls + '</div><div class="k">倒下次数</div></div>' +
        '<div><div class="v">' + S.xp + '</div><div class="k">经验</div></div>' +
        '<div><div class="v">' + fmt(secs) + '</div><div class="k">用时</div></div>' +
      '</div>' +
      '<h3>巩固计划（按遗忘曲线推送每日副本）</h3>' +
      '<div class="review">' + (wrong.length ? wrong.map(q =>
        '<div><b>' + esc(q.kw) + '</b><span class="note">第 ' + (q.seg + 1) + ' 段 · 回放 ' + fmt(q.t) + '</span><span class="when">' + day(1) + ' · ' + day(3) + ' · ' + day(7) + '</span></div>').join('')
        : '<div><b>全部一次答对</b><span class="when">' + day(7) + ' 推送一次综合复习</span></div>') + '</div>' +
      '<h3>回写到回放进度条的打点（请求体示意）</h3>' +
      '<pre class="code">' + esc(JSON.stringify(markers.length ? markers : [{ time: 0, desc: '全部通关，无倒下点' }], null, 2)) + '</pre>' +
      '<p class="note">你的错题会计入讲师端的全班卡关热力图（点上方「讲师视角」查看）。正式版的间隔由 FSRS 算法按你的作答记录计算，这里先用固定的 1 / 3 / 7 天示意。</p>' +
      '<div class="actions"><button class="btn" type="button" id="stay">留在地图</button><button class="btn primary" type="button" id="again">再闯一次</button></div>'
    );
    addLog('通关结算：正确率 ' + acc + '%，错题 ' + wrong.length + ' 个 → 生成巩固计划', 'ok');
    $('#stay').onclick = closeModal;
    $('#again').onclick = () => { reset(); closeModal(); };
  }

  // ───────────── 输入 ─────────────
  const KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0] };
  const sameDir = (a, b) => a[0] === b[0] && a[1] === b[1];
  window.addEventListener('keydown', ev => {
    const dir = KEYS[ev.key];
    if (!dir || !modal.hidden) return;
    if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    ev.preventDefault();
    if (!held.some(h => sameDir(h, dir))) held.push(dir);
  });
  window.addEventListener('keyup', ev => {
    const dir = KEYS[ev.key];
    if (!dir) return;
    for (let i = held.length - 1; i >= 0; i--) if (sameDir(held[i], dir)) held.splice(i, 1);
  });
  window.addEventListener('blur', () => { held.length = 0; });
  document.querySelectorAll('.pad button').forEach(b => {
    const dir = b.dataset.dir.split(',').map(Number);
    const release = () => { for (let i = held.length - 1; i >= 0; i--) if (sameDir(held[i], dir)) held.splice(i, 1); };
    b.addEventListener('pointerdown', ev => { ev.preventDefault(); if (modal.hidden && !held.some(h => sameDir(h, dir))) held.push(dir); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => b.addEventListener(n, release));
  });
  cv.tabIndex = 0;
  $('#teacherBtn').onclick = () => { S.teacher = !S.teacher; updateHud(); addLog(S.teacher ? '切到讲师视角：叠加全班卡关率' : '回到学员视角', 'warn'); };
  $('#resetBtn').onclick = () => reset();

  function reset() {
    S = fresh(); P = { rx: S.px, ry: S.py, face: 1 }; curRoom = -1; particles = [];
    enterRoom(0); updateHud();
    addLog('重新开始', 'warn');
  }

  // ───────────── 图例 ─────────────
  function legend() {
    const items = [
      ['slime', '关键词怪', '大纲每段的关键词，撞上就答一道由字幕生成的题'],
      ['boss', 'Boss 房', '全班答题卡错误率最高的那一段（本课 ' + DATA.failRate[BOSS_ROOM] + '%）'],
      ['npc', '隐藏 NPC', '聊天里被反复问的问题，数字人老师来解答'],
      ['fog', '迷雾', '观看记录里你没看过的段落，读完大纲才能进'],
      ['player', '倒下 = 补课', '生命耗尽就回到回放对应的 40 秒，看完复活']
    ];
    $('#legend').innerHTML = items.map(([k, t, d], i) => '<div class="lg"><canvas width="40" height="40" id="lg' + i + '"></canvas><div><b>' + t + '</b><span>' + d + '</span></div></div>').join('');
    items.forEach(([k], i) => {
      const c = document.getElementById('lg' + i).getContext('2d');
      c.fillStyle = '#2b2721'; c.fillRect(0, 0, 40, 40);
      if (k === 'slime') spr(c, SPR.slime, slimePal('#5fb3d9'), 4, 6, 4);
      if (k === 'boss') spr(c, SPR.boss, PAL.boss, 4, 4, 4);
      if (k === 'npc') spr(c, SPR.npc, PAL.npc, 4, 4, 4);
      if (k === 'player') spr(c, SPR.player, PAL.player, 4, 4, 4);
      if (k === 'fog') { c.fillStyle = '#0b0c12'; c.fillRect(0, 0, 40, 40); c.fillStyle = '#a395f2'; c.font = '700 26px "Pixelify Sans", monospace'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 20, 21); }
    });
  }

  // ───────────── 启动 ─────────────
  function boot(saved) {
    buildWorld();
    S = Object.assign(fresh(), saved && saved.S ? saved.S : {});
    P = { rx: S.px, ry: S.py, face: 1 };
    $('#courseTitle').textContent = DATA.course.title;
    $('#courseCh').textContent = DATA.course.channelId;
    $('#courseMeta').textContent = DATA.course.date + ' 直播回放 · ' + fmt(DATA.course.duration) + ' · ' + DATA.course.teacher;
    legend();
    updateHud();
    const r = roomOf[S.py][S.px];
    enterRoom(r >= 0 ? r : 0);
    if (!saved || !saved.S) {
      const qN = DATA.questions.length;
      [
        ['GET 视频大纲 → ' + DATA.outline.length + ' 段，生成 ' + DATA.outline.length + ' 个房间', ''],
        ['GET 智能字幕 → 412 条，按关键词生成 ' + qN + ' 道题', ''],
        ['GET 聊天记录 1,288 条 + 提问 96 条 → 聚类出 ' + DATA.clusters.length + ' 个高频问题', ''],
        ['GET 观看记录 → 缺失 ' + FOG_ROOMS.map(i => fmt(DATA.outline[i].start) + '–' + fmt(DATA.outline[i].end)).join('、') + '，加迷雾', 'warn'],
        ['答题卡统计 → 第 ' + (BOSS_ROOM + 1) + ' 段错误率 ' + DATA.failRate[BOSS_ROOM] + '%，设为 Boss 房', 'bad'],
        ['地下城生成完毕（seed = 频道号 ' + DATA.course.channelId + '）', 'ok']
      ].forEach(([t, k], i) => setTimeout(() => addLog(t, k), 120 + i * 260));
    }
    if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
      window.claude.hot.snapshot(() => ({ S }));
    }
    requestAnimationFrame(t => { last = t; frame(t); });
  }

  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

</body></html>
